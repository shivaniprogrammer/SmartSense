# Render assigns the port dynamically via PORT.

server.port=8081

# MongoDB - same Atlas database your Node backend uses
spring.data.mongodb.uri=${MONGO_URI:mongodb://127.0.0.1:27017/attendance-tracker}

# JWT
jwt.secret=${JWT_SECRET:dev-secret-change-this}

# Email providers (same keys as your Node backend's Render environment variables)
email.brevo-api-key=${BREVO_API_KEY:}
email.brevo-from=${EMAIL_FROM:smartsense.attendance.tracker@gmail.com}
email.resend-api-key=${RESEND_API_KEY:}
email.resend-from=${RESEND_FROM:SmartSense <onboarding@resend.dev>}
   smartsense.device-key=change-this-secret-123