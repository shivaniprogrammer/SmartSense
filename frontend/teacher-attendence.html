<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%A8</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance | SmartSense</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="teacher-sidebar.css">
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

:root {
  --primary: #0f9fa8;
  --primary-dark: #087f86;
  --primary-light: #dff7f8;
  --primary-soft: #eefafb;
  --white: #ffffff;
  --background: #f7fbfc;
  --text-dark: #14212b;
  --text-muted: #72818a;
  --border: #d9ecee;
  --green: #1f9d55;
  --green-bg: #e5f7ec;
  --amber: #b7791f;
  --amber-bg: #fff6e0;
  --red: #e45858;
  --red-bg: #ffeaea;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Inter", sans-serif; background: var(--background); color: var(--text-dark); }

.layout { display: flex; min-height: 100vh; }

.main { flex: 1; padding: 32px 4%; max-width: 1300px; }

.main-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.main-heading h1 { font-size: 24px; margin-bottom: 4px; }
.main-heading p { color: var(--text-muted); font-size: 13px; }

.date-picker {
  padding: 9px 14px; border: 1px solid var(--border); border-radius: 10px;
  font-family: inherit; font-size: 13px; background: var(--white); color: var(--text-dark);
}

.panel { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }

table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 10px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.5px; padding: 8px 10px; border-bottom: 1px solid var(--border);
}
td { padding: 12px 10px; font-size: 13px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }

.student-cell { display: flex; align-items: center; gap: 10px; }
.student-cell .avatar {
  width: 28px; height: 28px; border-radius: 50%; background: var(--primary-light);
  color: var(--primary-dark); display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
}

.status-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 100px; font-size: 11px; font-weight: 600; text-transform: capitalize;
}
.status-badge.present { background: var(--green-bg); color: var(--green); }
.status-badge.late { background: var(--amber-bg); color: var(--amber); }
.status-badge.absent { background: var(--red-bg); color: var(--red); }
.status-badge.unverified { background: #f0f0f0; color: var(--text-muted); }
.status-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.empty-state, .loading-state { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>

<div class="layout">

  <div id="sidebar-root"></div>

  <main class="main">

    <div class="main-heading">
      <div>
        <h1>Attendance</h1>
        <p>Class CSE-A — daily attendance records</p>
      </div>
      <input type="date" class="date-picker" id="dateFilter">
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr><th>Student</th><th>Check-in</th><th>Method</th><th>Status</th></tr>
        </thead>
        <tbody id="attendanceBody">
          <tr><td colspan="4"><div class="loading-state">Loading attendance...</div></td></tr>
        </tbody>
      </table>
    </div>

  </main>

</div>

<script src="teacher-sidebar.js"></script>
<script>
   const API_BASE = "/api";
const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "login-teacher.html";
}

const attendanceBody = document.getElementById("attendanceBody");
const dateFilter = document.getElementById("dateFilter");

function todayStr() {
  return new Date().toISOString().split("T")[0];
}

function initials(name) {
  return (name || "?").split(" ").map(function (w) { return w.charAt(0); }).slice(0, 2).join("").toUpperCase();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderAttendance(records) {
  if (!records.length) {
    attendanceBody.innerHTML = '<tr><td colspan="4"><div class="empty-state">No attendance records for this date.</div></td></tr>';
    return;
  }

  attendanceBody.innerHTML = records.map(function (r) {
    const name = r.student ? r.student.name : "Unknown student";
    const checkIn = r.checkInTime ? new Date(r.checkInTime).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "&mdash;";
    return (
      '<tr>' +
        '<td><div class="student-cell"><div class="avatar">' + initials(name) + '</div>' + escapeHtml(name) + '</div></td>' +
        '<td>' + checkIn + '</td>' +
        '<td>' + escapeHtml(r.method || "&mdash;") + '</td>' +
        '<td><span class="status-badge ' + r.status + '"><span class="dot"></span>' + escapeHtml(r.status) + '</span></td>' +
      '</tr>'
    );
  }).join("");
}

function loadAttendance() {
  attendanceBody.innerHTML = '<tr><td colspan="4"><div class="loading-state">Loading attendance...</div></td></tr>';

  const date = dateFilter.value || todayStr();

  // NOTE: this assumes a GET /api/attendance?date=YYYY-MM-DD endpoint returning
  // an array of AttendanceRecord docs populated with student name.
  // Adjust the endpoint/query param below to match your actual attendanceRoutes.js.
  fetch(API_BASE + "/attendance?date=" + date, {
    headers: { "Authorization": "Bearer " + token }
  })
    .then(function (res) {
      if (res.status === 401) {
        window.location.href = "login-teacher.html";
        return;
      }
      return res.json();
    })
    .then(function (records) {
      if (records) renderAttendance(Array.isArray(records) ? records : []);
    })
    .catch(function () {
      attendanceBody.innerHTML = '<tr><td colspan="4"><div class="empty-state">Could not load attendance. Is the server running?</div></td></tr>';
    });
}

dateFilter.value = todayStr();
dateFilter.addEventListener("change", loadAttendance);

loadAttendance();
</script>

</body>
</html>
