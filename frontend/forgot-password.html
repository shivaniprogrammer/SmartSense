<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - SmartSense</title>

    <!-- Use your existing login CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Forgot Password?</h1>

            <p class="subtitle">
                Reset your SmartSense account password
            </p>

            <!-- ========================= -->
            <!-- STEP 1: REQUEST OTP -->
            <!-- ========================= -->

            <div id="requestSection">

                <label for="role">Account Type</label>

                <select id="role" required>
                    <option value="">Select role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >

                <button id="sendOtpBtn" type="button">
                    Send OTP
                </button>

            </div>


            <!-- ========================= -->
            <!-- STEP 2: RESET PASSWORD -->
            <!-- ========================= -->

            <div id="resetSection" style="display: none;">

                <p>
                    An OTP has been sent to your email.
                </p>

                <label for="otp">OTP</label>

                <input
                    type="text"
                    id="otp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    required
                >

                <label for="newPassword">New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >

                <button id="resetPasswordBtn" type="button">
                    Reset Password
                </button>

                <button
                    id="resendBtn"
                    type="button"
                    style="margin-top: 10px;"
                >
                    Resend OTP
                </button>

            </div>


            <!-- Message area -->

            <p id="message"></p>


            <!-- Back to login -->

            <p>
                <a href="login.html">Back to Login</a>
            </p>

        </div>

    </div>


    <script>

        // =====================================
        // BACKEND URL
        // =====================================

        const API_BASE_URL = "/api/auth";


        // =====================================
        // ELEMENTS
        // =====================================

        const roleInput = document.getElementById("role");
        const emailInput = document.getElementById("email");

        const requestSection = document.getElementById("requestSection");
        const resetSection = document.getElementById("resetSection");

        const otpInput = document.getElementById("otp");
        const newPasswordInput = document.getElementById("newPassword");
        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const sendOtpBtn = document.getElementById("sendOtpBtn");
        const resetPasswordBtn =
            document.getElementById("resetPasswordBtn");

        const resendBtn = document.getElementById("resendBtn");

        const message = document.getElementById("message");


        // =====================================
        // SEND OTP
        // =====================================

        async function sendOtp() {

            const email = emailInput.value.trim();
            const role = roleInput.value;

            if (!role) {
                message.textContent = "Please select your account type.";
                return;
            }

            if (!email) {
                message.textContent = "Please enter your email.";
                return;
            }

            sendOtpBtn.disabled = true;
            sendOtpBtn.textContent = "Sending...";

            try {

                const response = await fetch(
                    `${API_BASE_URL}/forgot-password`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            role: role
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Failed to send OTP."
                    );
                }

                message.textContent =
                    "If an account exists, a reset code has been sent to your email.";

                // Show reset form
                requestSection.style.display = "none";
                resetSection.style.display = "block";

            } catch (error) {

                console.error(error);

                message.textContent =
                    error.message || "Something went wrong.";

            } finally {

                sendOtpBtn.disabled = false;
                sendOtpBtn.textContent = "Send OTP";

            }
        }


        // =====================================
        // RESET PASSWORD
        // =====================================

        async function resetPassword() {

            const email = emailInput.value.trim();
            const otp = otpInput.value.trim();
            const newPassword = newPasswordInput.value;
            const confirmPassword =
                confirmPasswordInput.value;

            if (!otp) {
                message.textContent = "Please enter the OTP.";
                return;
            }

            if (!newPassword) {
                message.textContent =
                    "Please enter your new password.";
                return;
            }

            if (newPassword.length < 6) {
                message.textContent =
                    "Password must be at least 6 characters.";
                return;
            }

            if (newPassword !== confirmPassword) {
                message.textContent =
                    "Passwords do not match.";
                return;
            }

            resetPasswordBtn.disabled = true;
            resetPasswordBtn.textContent = "Resetting...";

            try {

                const response = await fetch(
                    `${API_BASE_URL}/reset-password`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            otp: otp,
                            newPassword: newPassword
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Password reset failed."
                    );
                }

                message.textContent =
                    "Password reset successfully! Redirecting to login...";

                // Wait 2 seconds, then go to login
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);

            } catch (error) {

                console.error(error);

                message.textContent =
                    error.message || "Something went wrong.";

            } finally {

                resetPasswordBtn.disabled = false;
                resetPasswordBtn.textContent =
                    "Reset Password";

            }
        }


        // =====================================
        // RESEND OTP
        // =====================================

        async function resendOtp() {

            const email = emailInput.value.trim();
            const role = roleInput.value;

            if (!email || !role) {
                message.textContent =
                    "Email and account type are required.";
                return;
            }

            resendBtn.disabled = true;
            resendBtn.textContent = "Sending...";

            try {

                const response = await fetch(
                    `${API_BASE_URL}/forgot-password`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            role: role
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Failed to resend OTP."
                    );
                }

                message.textContent =
                    "A new OTP has been sent to your email.";

            } catch (error) {

                console.error(error);

                message.textContent =
                    error.message || "Something went wrong.";

            } finally {

                resendBtn.disabled = false;
                resendBtn.textContent = "Resend OTP";

            }
        }


        // =====================================
        // BUTTON EVENTS
        // =====================================

        sendOtpBtn.addEventListener(
            "click",
            sendOtp
        );

        resetPasswordBtn.addEventListener(
            "click",
            resetPassword
        );

        resendBtn.addEventListener(
            "click",
            resendOtp
        );

    </script>

</body>
</html>
