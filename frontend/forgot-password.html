<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%A8</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SmartSense</title>
    <link rel="stylesheet" href="login.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>
<body>

    <div class="login-topbar">
        <a href="index.html" class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div>
                <h2>SmartSense</h2>
                <span>Smart Classroom Management</span>
            </div>
        </a>

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>
    </div>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-role-icon">
                <i class="fa-solid fa-key"></i>
            </div>

            <h1>Reset Password</h1>
            <p class="subtitle" id="stepSubtitle">Enter your email and we'll send you a reset code.</p>

            <div class="form-status" id="formStatus"></div>

            <form id="requestForm" novalidate>

                <div class="form-group">
                    <label for="role">I am a</label>
                    <div class="role-toggle">
                        <input type="radio" name="role" id="roleStudent" value="student" checked>
                        <label for="roleStudent" class="role-toggle-btn">
                            <i class="fa-solid fa-user-graduate"></i> Student
                        </label>

                        <input type="radio" name="role" id="roleTeacher" value="teacher">
                        <label for="roleTeacher" class="role-toggle-btn">
                            <i class="fa-solid fa-chalkboard-user"></i> Teacher
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="you@college.edu" autocomplete="email">
                    </div>
                </div>

                <button type="submit" class="login-submit" id="requestBtn">
                    Send Reset Code
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <form id="resetForm" novalidate style="display: none;">

                <div class="form-group">
                    <label for="otp">Reset Code</label>
                    <div class="input-box">
                        <i class="fa-solid fa-shield-halved"></i>
                        <input type="text" id="otp" placeholder="6-digit code" maxlength="6" inputmode="numeric">
                    </div>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password">
                        <i class="fa-solid fa-eye toggle-password" id="toggleNewPassword"></i>
                    </div>
                </div>

                <button type="submit" class="login-submit" id="resetBtn">
                    Reset Password
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <p class="switch-role" style="margin-top: 14px;">
                    <a href="#" id="resendLink">Resend code</a>
                </p>

            </form>

            <p class="login-footer">
                Remembered your password? <a href="login-student.html">Log in</a>
            </p>

        </div>
    </div>

    <script>
       const API_BASE = "/api";

        const requestForm = document.getElementById("requestForm");
        const resetForm = document.getElementById("resetForm");
        const formStatus = document.getElementById("formStatus");
        const stepSubtitle = document.getElementById("stepSubtitle");
        const requestBtn = document.getElementById("requestBtn");
        const resetBtn = document.getElementById("resetBtn");
        const resendLink = document.getElementById("resendLink");

        let savedEmail = "";
        let savedRole = "student";

        function showStatus(text, type) {
            formStatus.textContent = text;
            formStatus.classList.remove("show", "success", "fail");
            formStatus.classList.add("show", type);
        }

        function setupToggle(toggleId, inputEl) {
            const toggle = document.getElementById(toggleId);
            if (!toggle) return;
            toggle.addEventListener("click", function () {
                const isPassword = inputEl.type === "password";
                inputEl.type = isPassword ? "text" : "password";
                toggle.classList.toggle("fa-eye");
                toggle.classList.toggle("fa-eye-slash");
            });
        }
        setupToggle("toggleNewPassword", document.getElementById("newPassword"));

        requestForm.addEventListener("submit", function (e) {
            e.preventDefault();

            savedEmail = document.getElementById("email").value.trim();
            savedRole = document.querySelector('input[name="role"]:checked').value;

            if (!savedEmail) {
                showStatus("Please enter your email.", "fail");
                return;
            }

            requestBtn.disabled = true;
            requestBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

            fetch(API_BASE + "/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: savedEmail, role: savedRole })
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    requestBtn.disabled = false;
                    requestBtn.innerHTML = 'Send Reset Code <i class="fa-solid fa-arrow-right"></i>';

                    showStatus(data.message || "If an account exists, a code has been sent.", "success");

                    requestForm.style.display = "none";
                    resetForm.style.display = "block";
                    stepSubtitle.textContent = "Enter the code sent to " + savedEmail;
                })
                .catch(function () {
                    requestBtn.disabled = false;
                    requestBtn.innerHTML = 'Send Reset Code <i class="fa-solid fa-arrow-right"></i>';
                    showStatus("Could not reach the server.", "fail");
                });
        });

        resetForm.addEventListener("submit", function (e) {
            e.preventDefault();

            const otp = document.getElementById("otp").value.trim();
            const newPassword = document.getElementById("newPassword").value;

            if (!otp || !newPassword) {
                showStatus("Please fill in both fields.", "fail");
                return;
            }

            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';

            fetch(API_BASE + "/auth/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: savedEmail, otp: otp, newPassword: newPassword })
            })
                .then(function (res) { return res.json().then(function (data) { return { status: res.status, data: data }; }); })
                .then(function (result) {
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = 'Reset Password <i class="fa-solid fa-arrow-right"></i>';

                    if (result.status !== 200) {
                        showStatus(result.data.error || "Something went wrong.", "fail");
                        return;
                    }

                    showStatus(result.data.message || "Password reset! Redirecting to login...", "success");

                    setTimeout(function () {
                        window.location.href = savedRole === "teacher" ? "login-teacher.html" : "login-student.html";
                    }, 1500);
                })
                .catch(function () {
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = 'Reset Password <i class="fa-solid fa-arrow-right"></i>';
                    showStatus("Could not reach the server.", "fail");
                });
        });

        resendLink.addEventListener("click", function (e) {
            e.preventDefault();
            requestForm.dispatchEvent(new Event("submit"));
        });
    </script>

</body>
</html>
