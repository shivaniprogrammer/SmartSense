<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students | SmartSense</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

:root {
  --primary: #0f9fa8;
  --primary-dark: #087f86;
  --primary-light: #dff7f8;
  --primary-soft: #eefafb;
  --white: #ffffff;
  --background: #f7fbfc;
  --text-dark: #14212b;
  --text-muted: #72818a;
  --border: #d9ecee;
  --green: #1f9d55;
  --green-bg: #e5f7ec;
  --amber: #b7791f;
  --amber-bg: #fff6e0;
  --red: #e45858;
  --red-bg: #ffeaea;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Inter", sans-serif; background: var(--background); color: var(--text-dark); }

.layout { display: flex; min-height: 100vh; }

.sidebar {
  width: 220px; background: linear-gradient(180deg, var(--primary), var(--primary-dark));
  color: white; padding: 24px 0; display: flex; flex-direction: column;
}
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 20px 24px; }
.sidebar-brand .icon {
  width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
}
.sidebar-brand h2 { font-size: 15px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75); text-decoration: none;
}
.nav-item.active { background: rgba(255,255,255,0.15); color: white; border-right: 3px solid white; }
.nav-item i { width: 16px; text-align: center; }

.main { flex: 1; padding: 32px 4%; }

.main-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.main-heading h1 { font-size: 24px; margin-bottom: 4px; }
.main-heading p { color: var(--text-muted); font-size: 13px; }

.toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
.search-box {
  flex: 1; max-width: 320px; display: flex; align-items: center; gap: 10px;
  background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
}
.search-box input { border: none; outline: none; font-size: 13px; flex: 1; font-family: inherit; }
.search-box i { color: var(--text-muted); }

.filter-select {
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
  font-size: 13px; color: var(--text-muted); background: var(--white); cursor: pointer;
}

.panel { background: var(--white); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }

table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 11px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.5px; padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--primary-soft);
}
td { padding: 14px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--primary-soft); }

.student-cell { display: flex; align-items: center; gap: 12px; }
.student-cell .avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--primary-light);
  color: var(--primary-dark); display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}
.student-cell .info strong { display: block; font-size: 13px; }
.student-cell .info span { font-size: 11px; color: var(--text-muted); }

.pct-bar-wrap { display: flex; align-items: center; gap: 10px; }
.pct-bar { width: 70px; height: 6px; background: var(--border); border-radius: 100px; overflow: hidden; }
.pct-bar-fill { height: 100%; background: var(--primary); border-radius: 100px; }
.pct-bar-fill.low { background: var(--red); }
.pct-bar-fill.mid { background: var(--amber); }

.status-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 100px; font-size: 11px; font-weight: 600;
}
.status-badge.present { background: var(--green-bg); color: var(--green); }
.status-badge.absent { background: var(--red-bg); color: var(--red); }
.status-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.action-icon {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--white); color: var(--text-muted); display: inline-flex; align-items: center;
  justify-content: center; cursor: pointer; font-size: 12px;
}

@media (max-width: 900px) {
  .sidebar { display: none; }
  table { font-size: 11px; }
  th, td { padding: 10px 8px; }
}
</style>

function getInitials(name) {
  return name.split(" ").map(n => n[0]).join("").slice(0, 2).toUpperCase();
}

function renderStudents(students) {
  const tbody = document.getElementById("studentTableBody");
  tbody.innerHTML = "";

  students.forEach(s => {
    const total = s.present + s.absent;
    const pct = total > 0 ? Math.round((s.present / total) * 100) : 0;
    const barClass = pct < 60 ? "low" : pct < 75 ? "mid" : "";

    const row = document.createElement("tr");
    row.innerHTML = `
      <td>
        <div class="student-cell">
          <div class="avatar">${getInitials(s.name)}</div>
          <div class="info">
            <strong>${s.name}</strong>
            <span>${s.studentId}</span>
          </div>
        </div>
      </td>
      <td>${s.present}</td>
      <td>${s.absent}</td>
      <td>
        <div class="pct-bar-wrap">
          <div class="pct-bar"><div class="pct-bar-fill ${barClass}" style="width: ${pct}%;"></div></div>
          <span>${pct}%</span>
        </div>
      </td>
      <td>
        <span class="status-badge ${s.todayStatus}">
          <span class="dot"></span>${s.todayStatus === "present" ? "Present" : "Absent"}
        </span>
      </td>
    `;
    tbody.appendChild(row);
  });
}

  // MOCK MODE — replace with the fetch() version shown in the comment above

// Simple client-side search + filter over the mock data
document.getElementById("searchInput").addEventListener("input", applyFilters);
document.getElementById("filterSelect").addEventListener("change", applyFilters);

function applyFilters() {
  const query = document.getElementById("searchInput").value.toLowerCase();
  const filter = document.getElementById("filterSelect").value;

  let filtered = mockStudents.filter(s =>
    s.name.toLowerCase().includes(query) || s.studentId.toLowerCase().includes(query)
  );

  if (filter === "low") {
    filtered = filtered.filter(s => {
      const total = s.present + s.absent;
      const pct = total > 0 ? (s.present / total) * 100 : 0;
      return pct < 75;
    });
  }

  renderStudents(filtered);
}
