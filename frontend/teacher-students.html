<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students | SmartSense</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="teacher-sidebar.css">
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

:root {
  --primary: #0f9fa8;
  --primary-dark: #087f86;
  --primary-light: #dff7f8;
  --white: #ffffff;
  --background: #f7fbfc;
  --text-dark: #14212b;
  --text-muted: #72818a;
  --border: #d9ecee;
  --green: #1f9d55;
  --green-bg: #e5f7ec;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Inter", sans-serif; background: var(--background); color: var(--text-dark); }

.layout { display: flex; min-height: 100vh; }
.main { flex: 1; padding: 32px 4%; max-width: 1300px; }

.main-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.main-heading h1 { font-size: 24px; margin-bottom: 4px; }
.main-heading p { color: var(--text-muted); font-size: 13px; }

.search-box {
  padding: 9px 14px; border: 1px solid var(--border); border-radius: 10px;
  font-family: inherit; font-size: 13px; width: 240px; outline: none;
}
.search-box:focus { border-color: var(--primary); }

.panel { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }

table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 10px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.5px; padding: 8px 10px; border-bottom: 1px solid var(--border);
}
td { padding: 12px 10px; font-size: 13px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }

.student-cell { display: flex; align-items: center; gap: 10px; }
.student-cell .avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--primary-light);
  color: var(--primary-dark); display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
}

.verified-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 100px; font-size: 11px; font-weight: 600;
}
.verified-badge.yes { background: var(--green-bg); color: var(--green); }
.verified-badge.no { background: #f0f0f0; color: var(--text-muted); }

.empty-state, .loading-state { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>

<div class="layout">

  <div id="sidebar-root"></div>

  <main class="main">

    <div class="main-heading">
      <div>
        <h1>Students</h1>
        <p>All enrolled students</p>
      </div>
      <input type="text" class="search-box" id="searchBox" placeholder="Search by name or ID...">
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr><th>Student</th><th>Student ID</th><th>Email</th><th>Email Verified</th></tr>
        </thead>
        <tbody id="studentsBody">
          <tr><td colspan="4"><div class="loading-state">Loading students...</div></td></tr>
        </tbody>
      </table>
    </div>

  </main>

</div>

<script src="teacher-sidebar.js"></script>
<script>
const API_BASE = "http://localhost:5000/api";
const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "login-teacher.html";
}

const studentsBody = document.getElementById("studentsBody");
const searchBox = document.getElementById("searchBox");
let allStudents = [];

function initials(name) {
  return (name || "?").split(" ").map(function (w) { return w.charAt(0); }).slice(0, 2).join("").toUpperCase();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderStudents(students) {
  if (!students.length) {
    studentsBody.innerHTML = '<tr><td colspan="4"><div class="empty-state">No students found.</div></td></tr>';
    return;
  }

  studentsBody.innerHTML = students.map(function (s) {
    return (
      '<tr>' +
        '<td><div class="student-cell"><div class="avatar">' + initials(s.name) + '</div>' + escapeHtml(s.name) + '</div></td>' +
        '<td>' + escapeHtml(s.studentId) + '</td>' +
        '<td>' + escapeHtml(s.email) + '</td>' +
        '<td><span class="verified-badge ' + (s.emailVerified ? "yes" : "no") + '">' + (s.emailVerified ? "Verified" : "Unverified") + '</span></td>' +
      '</tr>'
    );
  }).join("");
}

function loadStudents() {
  fetch(API_BASE + "/students", {
    headers: { "Authorization": "Bearer " + token }
  })
    .then(function (res) {
      if (res.status === 401) {
        window.location.href = "login-teacher.html";
        return;
      }
      return res.json();
    })
    .then(function (students) {
      if (students) {
        allStudents = students;
        renderStudents(allStudents);
      }
    })
    .catch(function () {
      studentsBody.innerHTML = '<tr><td colspan="4"><div class="empty-state">Could not load students. Is the server running?</div></td></tr>';
    });
}

searchBox.addEventListener("input", function () {
  const q = searchBox.value.trim().toLowerCase();
  const filtered = allStudents.filter(function (s) {
    return s.name.toLowerCase().includes(q) || s.studentId.toLowerCase().includes(q);
  });
  renderStudents(filtered);
});

loadStudents();
</script>

</body>
</html>
