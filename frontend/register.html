<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SmartSense</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="register.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>
<body>

    <div class="login-topbar">
        <a href="index.html" class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div>
                <h2>SmartSense</h2>
                <span>Smart Classroom Management</span>
            </div>
        </a>

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>
    </div>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-role-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h1>Create Account</h1>
            <p class="subtitle">Sign up to start using SmartSense.</p>

            <div class="form-status" id="formStatus"></div>

            <form id="registerForm" novalidate>

                <div class="form-group">
                    <label>I am a</label>
                    <div class="role-toggle">
                        <input type="radio" name="role" id="roleStudent" value="student" checked>
                        <label for="roleStudent" class="role-toggle-btn">
                            <i class="fa-solid fa-user-graduate"></i> Student
                        </label>

                        <input type="radio" name="role" id="roleTeacher" value="teacher">
                        <label for="roleTeacher" class="role-toggle-btn">
                            <i class="fa-solid fa-chalkboard-user"></i> Teacher
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="name" placeholder="Your full name" autocomplete="name">
                    </div>
                    <span class="error-msg" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <div class="input-box">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="studentId" placeholder="e.g. CSE2026041">
                    </div>
                    <span class="error-msg" id="studentIdError"></span>
                </div>

                <div class="form-group">
                    <label for="parentEmail">Parent/Guardian Email (optional)</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope-open-text"></i>
                        <input type="email" id="parentEmail" placeholder="parent@example.com" autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="you@college.edu" autocomplete="email">
                    </div>
                    <span class="error-msg" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password">
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                    <span class="error-msg" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password">
                        <i class="fa-solid fa-eye toggle-password" id="toggleConfirmPassword"></i>
                    </div>
                    <span class="error-msg" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="login-submit" id="submitBtn">
                    Create Account
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <p class="login-footer">
                Already have an account? <a href="login-student.html">Log in</a>
            </p>

        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
