<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%A8</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reports | SmartSense</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="teacher-sidebar.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="student-ui.css">
<style>
.btn{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:10px 16px;font:600 16px inherit;font-family:inherit;cursor:pointer;color:var(--text-dark);transition:.2s}
.btn:hover{border-color:var(--primary)}.btn:disabled{opacity:.5;cursor:not-allowed}
.demo-note{background:var(--amber-bg);color:var(--amber);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;margin-bottom:16px}
.weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.weekbar b{font-size:18px;min-width:230px;text-align:center}
.weekbar input{padding:10px 12px;border:1px solid var(--border);border-radius:12px;font:16px inherit;font-family:inherit;background:var(--white);color:var(--text-dark)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid var(--border);background:var(--white);color:var(--text-medium);font:600 17px inherit;font-family:inherit;padding:11px 22px;border-radius:99px;cursor:pointer;transition:.15s}
.tab:hover{background:var(--primary-soft)}.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.sum{color:var(--text-muted);font-size:16px}.sum b{color:var(--text-dark)}
.periods{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.period{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--border);border-left:5px solid var(--primary);border-radius:16px;background:var(--primary-soft);cursor:pointer;transition:.15s;text-align:left;font:inherit;font-family:inherit;color:inherit}
.period.lab{border-left-color:#3B82F6}.period:hover{box-shadow:0 8px 22px rgba(11,31,58,.1);transform:translateY(-1px)}.period.static{cursor:default}.period.static:hover{box-shadow:none;transform:none}
.period .pt{font-size:13px;font-weight:700;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.5px}
.period .sj{font-size:20px;font-weight:700;line-height:1.3}.period .tm{font-size:16px;color:var(--text-muted)}.period .fc{font-size:15px;color:var(--text-muted)}
.cnt{display:flex;gap:12px;flex-wrap:wrap;font-size:15px;font-weight:700}.cnt .p{color:var(--green)}.cnt .l{color:var(--amber)}.cnt .a{color:var(--red)}
.meter{height:10px;border-radius:99px;background:var(--border);overflow:hidden}.meter span{display:block;height:100%;background:var(--primary);border-radius:99px}
.meter.mid span{background:var(--amber)}.meter.low span{background:var(--red)}
.hol{text-align:center;padding:50px 16px;color:var(--text-muted)}.hol i{font-size:36px;color:var(--primary);display:block;margin-bottom:12px}.hol strong{display:block;font-size:20px;color:var(--text-dark);margin-bottom:4px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--primary);font:700 17px inherit;font-family:inherit;background:none;border:0;cursor:pointer;margin-bottom:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input{flex:1;min-width:200px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font:16px inherit;font-family:inherit;background:var(--white);color:var(--text-dark)}
.chip{border:1px solid var(--border);background:var(--white);color:var(--text-medium);font:600 15px inherit;font-family:inherit;padding:8px 16px;border-radius:99px;cursor:pointer}.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:17px}
th{text-align:left;font-size:14px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;padding:12px 10px;border-bottom:1px solid var(--border)}
td{padding:13px 10px;border-bottom:1px solid var(--border)}tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:12px}.av{width:40px;height:40px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.pill{display:inline-flex;align-items:center;padding:4px 14px;border-radius:99px;font-size:15px;font-weight:700}
.pill.present{background:var(--green-bg);color:var(--green)}.pill.late{background:var(--amber-bg);color:var(--amber)}.pill.absent{background:var(--red-bg);color:var(--red)}
.empty{color:var(--text-muted);padding:18px 4px;font-size:16px}
@media(max-width:1000px){.sidebar>div:last-child{flex:1}.sidebar>div:last-child .nav-item{flex-direction:column;text-align:center;justify-content:center;gap:2px;padding:8px 2px;font-size:12px}}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>
  <main class="dash-main">
    <div class="dash-topbar">
      <div><p id="sub">Class timetable and attendance, period by period</p><h1>Reports</h1></div>
      <div class="topbar-right"><div class="profile-pill"><div class="profile-avatar" id="avatarInitial">T</div><span id="profileName">Teacher</span></div></div>
    </div>
    <div class="demo-note" id="demoNote" hidden>Demo mode: the attendance numbers below are sample values, not from the server. The timetable is the real CSE F timetable. Set DEMO to false in teacher-sample.js to use real data.</div>

    <div id="listView">
      <div class="weekbar">
        <button class="btn" id="prev" type="button">&larr; Previous week</button>
        <b id="weekLabel"></b>
        <button class="btn" id="next" type="button">Next week &rarr;</button>
        <input type="date" id="pick" aria-label="Jump to a date">
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="panel">
        <div class="panel-heading"><h4 id="dayTitle"></h4><div class="sum" id="daySum"></div></div>
        <div id="body"></div>
      </div>
    </div>

    <div id="sessionView" style="display:none">
      <button class="back" id="backBtn" type="button"><i class="fa-solid fa-arrow-left"></i> Back to timetable</button>
      <div class="panel">
        <div class="panel-heading"><h4 id="sessionTitle"></h4></div>
        <div class="stats-grid" id="sessStats"></div>
        <div class="tools"><input type="search" id="q" placeholder="Search student name" aria-label="Search student"><span id="chips"></span></div>
        <div class="scroll"><table><thead><tr><th>Student</th><th>Check-in</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
      </div>
    </div>
  </main>
</div>

<script src="teacher-sidebar.js"></script>
<script src="timetable-data.js"></script>
<script src="teacher-sample.js"></script>
<script>
(function () {
  const DEMO = TS.DEMO, token = localStorage.getItem("token");
  if (!token) { window.location.href = "login-teacher.html"; return; }
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const short = (d) => d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  const NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  let myClass = "CSE F";
  try { const u = JSON.parse(localStorage.getItem("user") || "null"); if (u && u.name) { $("profileName").textContent = u.name.split(" ")[0]; $("avatarInitial").textContent = u.name.charAt(0).toUpperCase(); } } catch (e) {}
  fetch("/api/auth/me", { headers: { "Authorization": "Bearer " + token } }).then((r) => r.json()).then((d) => {
    const a = d && d.user; if (a && a.coordinatorClass) { myClass = a.coordinatorClass; head(); }
  }).catch(() => {});
  function head() { $("sub").textContent = "Class " + myClass + " timetable and attendance, period by period"; }
  head(); $("demoNote").hidden = !DEMO;

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const monday0 = new Date(today); monday0.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  let weekOffset = 0, sel = today.getDay() >= 1 && today.getDay() <= 5 ? today.getDay() - 1 : 4;
  const dateOf = (i) => { const d = new Date(monday0); d.setDate(d.getDate() + weekOffset * 7 + i); return d; };

  function render() {
    const mon = dateOf(0), sat = dateOf(5), date = dateOf(sel), day = iso(date), future = date > today;
    $("weekLabel").textContent = short(mon) + " – " + short(sat) + " " + sat.getFullYear();
    $("next").disabled = weekOffset >= 0; $("pick").max = iso(today); $("pick").value = day;
    $("tabs").innerHTML = NAMES.map((n, i) => '<button class="tab' + (i === sel ? " on" : "") + '" data-i="' + i + '" type="button">' + n + "</button>").join("");
    document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => { sel = +b.dataset.i; render(); }));
    $("dayTitle").textContent = NAMES[sel] + ", " + date.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });

    if (sel === 5) { $("daySum").textContent = ""; $("body").innerHTML = '<div class="hol"><i class="fa-solid fa-mug-hot"></i><strong>Holiday</strong>No classes on Saturday</div>'; return; }

    const slots = SS.TT[sel]; let sum = 0, n = 0;
    const cards = slots.map((s, i) => {
      const x = SS.info(s[0]), title = '<span class="pt">Period ' + (s[1] === s[2] ? s[1] : s[1] + "–" + s[2]) + '</span><span class="sj">' + esc(x.name) + '</span><span class="tm">' + SS.timeLabel(s[1], s[2]) + '</span><span class="fc">' + esc(x.lab ? "Lab session" : x.faculty) + "</span>";
      if (!DEMO || future) return '<div class="period static' + (x.lab ? " lab" : "") + '">' + title + '<span class="fc">' + (future ? "Upcoming" : "No per-period attendance saved yet") + "</span></div>";
      const rec = TS.records(myClass, s[0], day, SS.startMin(s[1])), c = { present: 0, late: 0, absent: 0 };
      rec.forEach((r) => c[r.status]++);
      const pct = Math.round(((c.present + c.late) / rec.length) * 1000) / 10; sum += pct; n++;
      return '<button class="period' + (x.lab ? " lab" : "") + '" data-i="' + i + '" type="button">' + title + '<span class="cnt"><span class="p">' + c.present + ' present</span><span class="l">' + c.late + ' late</span><span class="a">' + c.absent + ' absent</span></span><span class="meter ' + (pct < 60 ? "low" : pct < 75 ? "mid" : "") + '"><span style="width:' + pct + '%"></span></span><span class="fc"><b>' + pct + "%</b> attended</span></button>";
    }).join("");
    $("daySum").innerHTML = n ? "<b>" + Math.round(sum / n) + "%</b> average attendance" : "";
    $("body").innerHTML = '<div class="periods">' + cards + "</div>";
    document.querySelectorAll(".period[data-i]").forEach((b) => b.addEventListener("click", () => {
      const s = slots[+b.dataset.i], x = SS.info(s[0]);
      openSession(x.name + " — " + myClass + " — " + short(date), TS.records(myClass, s[0], day, SS.startMin(s[1])));
    }));
  }
  $("prev").addEventListener("click", () => { weekOffset--; render(); });
  $("next").addEventListener("click", () => { if (weekOffset < 0) { weekOffset++; render(); } });
  $("pick").addEventListener("change", () => {
    if (!$("pick").value) return; const d = new Date($("pick").value + "T00:00:00"), w = d.getDay();
    weekOffset = Math.min(0, Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((w + 6) % 7)) - monday0) / 604800000)); sel = w === 0 ? 5 : w - 1; render();
  });

  /* ---------- student list for one period ---------- */
  let RECORDS = [], status = "all", title = "";
  function renderSession() {
    const c = { present: 0, late: 0, absent: 0 }; RECORDS.forEach((r) => c[r.status]++);
    const t = RECORDS.length, pct = t ? Math.round(((c.present + c.late) / t) * 1000) / 10 : 0;
    $("sessionTitle").textContent = title + " · " + pct + "% attended";
    $("sessStats").innerHTML = [["Students", t, "fa-users", ""], ["Present", c.present, "fa-user-check", "present"], ["Late", c.late, "fa-clock", "pending"], ["Absent", c.absent, "fa-user-xmark", "absent"]]
      .map((x) => '<div class="stat-card"><div class="icon ' + x[3] + '"><i class="fa-solid ' + x[2] + '"></i></div><p>' + x[0] + "</p><h3>" + x[1] + "</h3></div>").join("");
    $("chips").innerHTML = ["all", "present", "late", "absent"].map((k) => '<button class="chip' + (k === status ? " on" : "") + '" data-s="' + k + '" type="button">' + k.charAt(0).toUpperCase() + k.slice(1) + "</button>").join(" ");
    document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { status = b.dataset.s; renderSession(); }));
    const q = $("q").value.trim().toLowerCase(), list = RECORDS.filter((r) => (status === "all" || r.status === status) && (!q || r.student.name.toLowerCase().includes(q)));
    $("rows").innerHTML = list.length ? list.map((r) => {
      const tm = r.checkInTime ? r.checkInTime.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : "—";
      return '<tr><td><div class="who"><div class="av">' + esc(r.student.name.split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase()) + '</div><div>' + esc(r.student.name) + '<div class="fc">' + esc(r.student.studentId || "") + "</div></div></div></td><td>" + tm + '</td><td><span class="pill ' + r.status + '">' + r.status.charAt(0).toUpperCase() + r.status.slice(1) + "</span></td></tr>";
    }).join("") : '<tr><td colspan="3" class="empty">No students match.</td></tr>';
  }
  function openSession(t, recs) { title = t; RECORDS = recs; status = "all"; $("q").value = ""; $("listView").style.display = "none"; $("sessionView").style.display = "block"; window.scrollTo(0, 0); renderSession(); }
  $("backBtn").addEventListener("click", () => { $("sessionView").style.display = "none"; $("listView").style.display = "block"; });
  $("q").addEventListener("input", renderSession);

  render();
})();
</script>
<script src="theme.js"></script>
</body>
</html>
