<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%A8</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports | SmartSense</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

:root {
  --primary: #0f9fa8;
  --primary-dark: #087f86;
  --primary-light: #dff7f8;
  --primary-soft: #eefafb;
  --white: #ffffff;
  --background: #f7fbfc;
  --text-dark: #14212b;
  --text-muted: #72818a;
  --border: #d9ecee;
  --green: #1f9d55;
  --green-bg: #e5f7ec;
  --amber: #b7791f;
  --amber-bg: #fff6e0;
  --red: #e45858;
  --red-bg: #ffeaea;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Inter", sans-serif;
  background: var(--background);
  color: var(--text-dark);
}

.layout { display: flex; min-height: 100vh; }

.sidebar {
  width: 220px;
  background: linear-gradient(180deg, var(--primary), var(--primary-dark));
  color: white;
  padding: 24px 0;
  display: flex;
  flex-direction: column;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px 24px;
}

.sidebar-brand .icon {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar-brand h2 { font-size: 15px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.75);
  text-decoration: none;
  cursor: pointer;
  transition: 0.2s ease;
}

.nav-item:hover { background: rgba(255,255,255,0.1); color: white; }

.nav-item.active {
  background: rgba(255,255,255,0.15);
  color: white;
  border-right: 3px solid white;
}

.nav-item i { width: 16px; text-align: center; }

.notification-badge {
  background: #ef4444;
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 100px;
  margin-left: auto;
}

.main { flex: 1; padding: 32px 4%; }

.main-heading { margin-bottom: 24px; }
.main-heading h1 { font-size: 24px; margin-bottom: 4px; }
.main-heading p { color: var(--text-muted); font-size: 13px; }

/* Day tabs */
.day-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.day-tab {
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--text-dark);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 9px 18px;
  border-radius: 100px;
  cursor: pointer;
  transition: 0.15s ease;
}
.day-tab:hover { background: var(--primary-soft); }
.day-tab.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.panel {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
}
.panel-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.panel-heading h3 { font-size: 16px; }
.panel-heading .day-summary { font-size: 12px; color: var(--text-muted); }
.panel-heading .day-summary strong { color: var(--text-dark); }

.holiday-box {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-muted);
}
.holiday-box i {
  font-size: 32px;
  color: var(--primary);
  margin-bottom: 12px;
  display: block;
}
.holiday-box strong {
  display: block;
  font-size: 16px;
  color: var(--text-dark);
  margin-bottom: 4px;
}

.class-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.class-box {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  background: var(--primary-soft);
}
.class-box .period-tag {
  font-size: 10px;
  font-weight: 700;
  color: var(--primary-dark);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.class-box .subject {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-dark);
  margin-bottom: 4px;
}
.class-box .time {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.pct-bar-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.pct-bar { flex: 1; height: 6px; background: var(--border); border-radius: 100px; overflow: hidden; }
.pct-bar-fill { height: 100%; background: var(--primary); border-radius: 100px; }
.pct-bar-fill.low { background: var(--red); }
.pct-bar-fill.mid { background: var(--amber); }
.pct-bar-wrap span { font-size: 12px; font-weight: 700; }

.count-row {
  display: flex;
  gap: 10px;
  font-size: 11px;
  color: var(--text-muted);
}
.count-row .present-count { color: var(--green); font-weight: 700; }
.count-row .absent-count { color: var(--red); font-weight: 700; }

/* Notification Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 9998;
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: white;
  border-radius: 18px;
  padding: 32px;
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal-close {
  position: absolute;
  top: 12px;
  right: 15px;
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 50%;
  background: #f1f3f4;
  color: #555;
  font-size: 18px;
  cursor: pointer;
}
.modal-close:hover { background: #e5e7eb; }
.modal h2 { font-size: 20px; margin-bottom: 16px; color: var(--text-dark); }
.notification-item {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.notification-item:last-child { border-bottom: none; }
.notification-item .icon-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--primary-light);
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.notification-item .content { flex: 1; }
.notification-item .content strong { display: block; font-size: 13px; color: var(--text-dark); }
.notification-item .content span { font-size: 12px; color: var(--text-muted); }
.notification-item .time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }

@media (max-width: 900px) {
  .sidebar { display: none; }
}
</style>
</head>

<body>

<div class="layout">

  <aside class="sidebar">

    <div class="sidebar-brand">
      <div class="icon">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h2>SmartSense</h2>
    </div>

    <a href="teacher-dashboard.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      Dashboard
    </a>

    <a href="teacher-students.html" class="nav-item">
      <i class="fa-solid fa-user-graduate"></i>
      Students
    </a>

    <a href="teacher-attendence.html" class="nav-item">
      <i class="fa-solid fa-calendar-check"></i>
      Attendance
    </a>

    <a href="teacher-reports.html" class="nav-item active">
      <i class="fa-solid fa-file-lines"></i>
      Reports
    </a>

    <div class="nav-item" id="notificationsLink">
      <i class="fa-solid fa-bell"></i>
      Notifications
      <span class="notification-badge">3</span>
    </div>

  </aside>


  <main class="main">

    <div class="main-heading">
      <h1>Reports</h1>
      <p>Class CSE-F timetable and attendance, day by day</p>
    </div>

    <div class="day-tabs" id="dayTabs"></div>

    <div class="panel">
      <div class="panel-heading">
        <h3 id="panelDayTitle">Monday</h3>
        <div class="day-summary" id="panelDaySummary"></div>
      </div>

      <div id="panelBody"></div>
    </div>

  </main>

</div>

<div class="modal-overlay" id="notificationsModal">
  <div class="modal">
    <button class="modal-close" id="notificationsModalClose">×</button>
    <h2>🔔 Notifications</h2>

    <div class="notification-item">
      <div class="icon-circle"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <div class="content">
        <strong>Low attendance alert</strong>
        <span>5 students have attendance below 75%</span>
      </div>
      <span class="time">1 hour ago</span>
    </div>

    <div class="notification-item">
      <div class="icon-circle"><i class="fa-solid fa-file-pen"></i></div>
      <div class="content">
        <strong>Report generated</strong>
        <span>Monthly attendance report is ready</span>
      </div>
      <span class="time">1 day ago</span>
    </div>
  </div>
</div>

<script>
/*
  ================================================================
  MOCK DATA — replace with a real fetch() call once the backend
  exposes the class timetable + per-period present/absent counts
  for a given day, e.g.:

    async function loadDay(day) {
      const token = localStorage.getItem("token");
      const res = await fetch("/api/reports/class/CSE-F/" + day, {
        headers: { Authorization: "Bearer " + token }
      });
      const data = await res.json(); // { periods: [...], classSize }
      renderDay(day, data.periods, data.classSize);
    }

  Each period item should keep this shape so renderDay() doesn't
  need to change: { period, time, subject, present, absent }
  ================================================================
*/

const CLASS_SIZE = 68;

// Real class timetable: II Year - III Semester, CSE F Section
// (w.e.f. 06.07.2026). present/absent counts are still placeholders
// until the backend supplies real per-period attendance.
const timetableByDay = {
  Monday: [
    { period: 1, time: "8:15 - 9:05", subject: "Computer Networks", present: 63, absent: 5 },
    { period: 2, time: "9:05 - 9:55", subject: "Embedded System Design", present: 60, absent: 8 },
    { period: "3-5", time: "10:10 - 12:40", subject: "Advanced Data Structures and Algorithms", present: 61, absent: 7 },
    { period: 6, time: "1:30 - 2:15", subject: "Discrete Mathematics", present: 64, absent: 4 },
    { period: "7-8", time: "2:15 - 3:45", subject: "OOP using Java - Lab", present: 65, absent: 3 },
  ],
  Tuesday: [
    { period: 1, time: "8:15 - 9:05", subject: "Aptitude Test", present: 62, absent: 6 },
    { period: 2, time: "9:05 - 9:55", subject: "Computer Networks", present: 60, absent: 8 },
    { period: 3, time: "10:10 - 11:00", subject: "Fundamentals of AI and ML", present: 59, absent: 9 },
    { period: 4, time: "11:00 - 11:50", subject: "Discrete Mathematics", present: 57, absent: 11 },
    { period: 5, time: "11:50 - 12:40", subject: "Counselling", present: 63, absent: 5 },
    { period: 6, time: "1:30 - 2:15", subject: "OOP using Java", present: 61, absent: 7 },
    { period: "7-8", time: "2:15 - 3:45", subject: "Embedded System Design - Lab", present: 64, absent: 4 },
  ],
  Wednesday: [
    { period: 1, time: "8:15 - 9:05", subject: "Fundamentals of AI and ML", present: 60, absent: 8 },
    { period: 2, time: "9:05 - 9:55", subject: "Embedded System Design", present: 58, absent: 10 },
    { period: 3, time: "10:10 - 11:00", subject: "Discrete Mathematics", present: 62, absent: 6 },
    { period: "4-5", time: "11:00 - 12:40", subject: "OOP using Java - Lab", present: 65, absent: 3 },
    { period: 6, time: "1:30 - 2:15", subject: "Advanced Data Structures and Algorithms", present: 59, absent: 9 },
    { period: "7-8", time: "2:15 - 3:45", subject: "ADSA Lab", present: 61, absent: 7 },
  ],
  Thursday: [
    { period: 1, time: "8:15 - 9:05", subject: "Technical Test", present: 60, absent: 8 },
    { period: 2, time: "9:05 - 9:55", subject: "Computer Networks", present: 63, absent: 5 },
    { period: 3, time: "10:10 - 11:00", subject: "Fundamentals of AI and ML", present: 61, absent: 7 },
    { period: "4-5", time: "11:00 - 12:40", subject: "Career Skill Development III", present: 58, absent: 10 },
    { period: 6, time: "1:30 - 2:15", subject: "Embedded System Design", present: 62, absent: 6 },
    { period: 7, time: "2:15 - 3:00", subject: "Discrete Mathematics (Tutorial)", present: 64, absent: 4 },
    { period: 8, time: "3:00 - 3:45", subject: "Leet Code", present: 59, absent: 9 },
  ],
  Friday: [
    { period: 1, time: "8:15 - 9:05", subject: "Embedded System Design", present: 57, absent: 11 },
    { period: 2, time: "9:05 - 9:55", subject: "Computer Networks", present: 62, absent: 6 },
    { period: 3, time: "10:10 - 11:00", subject: "OOP using Java", present: 60, absent: 8 },
    { period: 4, time: "11:00 - 11:50", subject: "Fundamentals of AI and ML", present: 64, absent: 4 },
    { period: 5, time: "11:50 - 12:40", subject: "Discrete Mathematics", present: 58, absent: 10 },
    { period: 6, time: "1:30 - 2:15", subject: "NPTEL", present: 61, absent: 7 },
    { period: "7-8", time: "2:15 - 3:45", subject: "Fundamentals of AI and ML - Lab", present: 63, absent: 5 },
  ],
  // No Saturday classes on this timetable - shows as a holiday below
};

const dayOrder = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const weekendDays = ["Saturday", "Sunday"];

function todayName() {
  const names = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  return names[new Date().getDay()];
}

function renderTabs(selectedDay) {
  const dayTabs = document.getElementById("dayTabs");
  dayTabs.innerHTML = "";

  dayOrder.forEach(function (day) {
    const btn = document.createElement("button");
    btn.className = "day-tab" + (day === selectedDay ? " active" : "");
    btn.textContent = day;
    btn.addEventListener("click", function () {
      renderDay(day);
    });
    dayTabs.appendChild(btn);
  });
}

function renderDay(day) {
  renderTabs(day);

  document.getElementById("panelDayTitle").textContent = day;

  const panelBody = document.getElementById("panelBody");
  const panelDaySummary = document.getElementById("panelDaySummary");

  if (weekendDays.includes(day) && !timetableByDay[day]) {
    panelDaySummary.textContent = "";
    panelBody.innerHTML =
      '<div class="holiday-box">' +
        '<i class="fa-solid fa-mug-hot"></i>' +
        '<strong>Holiday</strong>' +
        '<span>No classes scheduled on ' + day + '</span>' +
      '</div>';
    return;
  }

  const periods = timetableByDay[day] || [];

  const avgPct = periods.length
    ? Math.round(
        periods.reduce(function (sum, p) { return sum + (p.present / CLASS_SIZE) * 100; }, 0) / periods.length
      )
    : 0;

  panelDaySummary.innerHTML = '<strong>' + avgPct + '%</strong> average attendance';

  const grid = document.createElement("div");
  grid.className = "class-grid";

  periods.forEach(function (p) {
    const pct = Math.round((p.present / CLASS_SIZE) * 100);
    const barClass = pct < 60 ? "low" : pct < 75 ? "mid" : "";

    const box = document.createElement("div");
    box.className = "class-box";
    box.innerHTML =
      '<div class="period-tag">Period ' + p.period + '</div>' +
      '<div class="subject">' + p.subject + '</div>' +
      '<div class="time">' + p.time + '</div>' +
      '<div class="pct-bar-wrap">' +
        '<div class="pct-bar"><div class="pct-bar-fill ' + barClass + '" style="width:' + pct + '%;"></div></div>' +
        '<span>' + pct + '%</span>' +
      '</div>' +
      '<div class="count-row">' +
        '<span class="present-count">' + p.present + ' present</span>' +
        '<span class="absent-count">' + p.absent + ' absent</span>' +
      '</div>';
    grid.appendChild(box);
  });

  panelBody.innerHTML = "";
  panelBody.appendChild(grid);
}

const initialDay = dayOrder.includes(todayName()) ? todayName() : "Monday";
renderDay(initialDay);
</script>

<script>
const notificationsLink = document.getElementById("notificationsLink");
const notificationsModal = document.getElementById("notificationsModal");
const notificationsModalClose = document.getElementById("notificationsModalClose");

notificationsLink.addEventListener("click", function() {
  notificationsModal.classList.add("show");
});

notificationsModalClose.addEventListener("click", function() {
  notificationsModal.classList.remove("show");
});

notificationsModal.addEventListener("click", function(e) {
  if (e.target === notificationsModal) {
    notificationsModal.classList.remove("show");
  }
});
</script>

</body>
</html>
