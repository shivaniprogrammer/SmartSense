<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%A8</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave & OD Requests | SmartSense</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="teacher-sidebar.css">
<link rel="stylesheet" href="theme.css">
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

:root {
  --primary: #0f9fa8;
  --primary-dark: #087f86;
  --primary-light: #dff7f8;
  --primary-soft: #eefafb;
  --white: #ffffff;
  --background: #f7fbfc;
  --text-dark: #14212b;
  --text-muted: #72818a;
  --border: #d9ecee;
  --green: #1f9d55;
  --green-bg: #e5f7ec;
  --amber: #b7791f;
  --amber-bg: #fff6e0;
  --red: #e45858;
  --red-bg: #ffeaea;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Inter", sans-serif; background: var(--background); color: var(--text-dark); }

.layout { display: flex; min-height: 100vh; }

.main { flex: 1; padding: 32px 4%; max-width: 1300px; }

.main-heading { margin-bottom: 24px; }
.main-heading h1 { font-size: 24px; margin-bottom: 4px; }
.main-heading p { color: var(--text-muted); font-size: 13px; }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab-btn {
  padding: 9px 16px; border-radius: 100px; border: 1px solid var(--border); background: var(--white);
  font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer;
}
.tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

.panel { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }

.request-card {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 18px 0; border-bottom: 1px solid var(--border); gap: 16px;
}
.request-card:last-child { border-bottom: none; }

.request-info { flex: 1; }
.request-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.request-name { font-size: 14px; font-weight: 700; }
.request-type-tag {
  font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 9px;
  border-radius: 100px; background: var(--primary-light); color: var(--primary-dark);
}
.request-dates { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.request-reason { font-size: 13px; color: var(--text-dark); }

.request-actions { display: flex; gap: 8px; flex-shrink: 0; }
.btn-approve, .btn-reject {
  padding: 8px 16px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; cursor: pointer;
}
.btn-approve { background: var(--green-bg); color: var(--green); }
.btn-approve:hover { background: var(--green); color: white; }
.btn-reject { background: var(--red-bg); color: var(--red); }
.btn-reject:hover { background: var(--red); color: white; }
.btn-approve:disabled, .btn-reject:disabled { opacity: 0.5; cursor: not-allowed; }

.status-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
  border-radius: 100px; font-size: 11px; font-weight: 700; text-transform: capitalize;
}
.status-badge.approved { background: var(--green-bg); color: var(--green); }
.status-badge.rejected { background: var(--red-bg); color: var(--red); }

.empty-state { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 13px; }
.loading-state { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>

<div class="layout">

  <div id="sidebar-root"></div>

  <main class="main">

    <div class="main-heading">
      <h1>Leave & OD Requests</h1>
      <p>Review and respond to student requests</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="pending">Pending</button>
      <button class="tab-btn" data-tab="all">All Requests</button>
    </div>

    <div class="panel">
      <div id="requestsList">
        <div class="loading-state">Loading requests...</div>
      </div>
    </div>

  </main>

</div>

<script src="teacher-sidebar.js"></script>
<script src="theme.js"></script>
<script>
   const API_BASE = "/api";
const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "login-teacher.html";
}

const requestsList = document.getElementById("requestsList");
const tabButtons = document.querySelectorAll(".tab-btn");
let currentTab = "pending";

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderRequests(requests) {
  if (!requests.length) {
    requestsList.innerHTML = '<div class="empty-state">No ' + (currentTab === "pending" ? "pending" : "") + ' requests to show.</div>';
    return;
  }

  requestsList.innerHTML = requests.map(function (r) {
    const studentName = r.student ? r.student.name : "Unknown student";

    const actionsHtml = r.status === "pending"
      ? '<div class="request-actions">' +
          '<button class="btn-approve" data-action="approve" data-id="' + r._id + '">Approve</button>' +
          '<button class="btn-reject" data-action="reject" data-id="' + r._id + '">Reject</button>' +
        '</div>'
      : '<span class="status-badge ' + r.status + '">' + escapeHtml(r.status) + '</span>';

    return (
      '<div class="request-card">' +
        '<div class="request-info">' +
          '<div class="request-top">' +
            '<span class="request-name">' + escapeHtml(studentName) + '</span>' +
            '<span class="request-type-tag">' + escapeHtml(r.type) + '</span>' +
          '</div>' +
          '<div class="request-dates">' + formatDate(r.fromDate) + ' &mdash; ' + formatDate(r.toDate) + '</div>' +
          '<div class="request-reason">' + escapeHtml(r.reason) + '</div>' +
        '</div>' +
        actionsHtml +
      '</div>'
    );
  }).join("");
}

function loadRequests() {
  requestsList.innerHTML = '<div class="loading-state">Loading requests...</div>';

  const endpoint = currentTab === "pending" ? "/requests/pending" : "/requests";

  fetch(API_BASE + endpoint, {
    headers: { "Authorization": "Bearer " + token }
  })
    .then(function (res) {
      if (res.status === 401) {
        window.location.href = "login-teacher.html";
        return;
      }
      return res.json();
    })
    .then(function (requests) {
      if (requests) renderRequests(requests);
    })
    .catch(function () {
      requestsList.innerHTML = '<div class="empty-state">Could not load requests. Is the server running?</div>';
    });
}

tabButtons.forEach(function (btn) {
  btn.addEventListener("click", function () {
    tabButtons.forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    currentTab = btn.getAttribute("data-tab");
    loadRequests();
  });
});

requestsList.addEventListener("click", function (e) {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;

  const id = btn.getAttribute("data-id");
  const action = btn.getAttribute("data-action");

  btn.disabled = true;
  const siblingBtns = btn.parentElement.querySelectorAll("button");
  siblingBtns.forEach(function (b) { b.disabled = true; });

  fetch(API_BASE + "/requests/" + id + "/" + action, {
    method: "PATCH",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({})
  })
    .then(function (res) { return res.json(); })
    .then(function () {
      loadRequests();
    })
    .catch(function () {
      alert("Could not reach the server. Please try again.");
      siblingBtns.forEach(function (b) { b.disabled = false; });
    });
});

loadRequests();
</script>

</body>
</html>
