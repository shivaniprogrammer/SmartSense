<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%A8</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Leave &amp; OD Requests | SmartSense</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="teacher-sidebar.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="student-ui.css">
<style>
.toast{display:none;padding:14px 18px;border-radius:12px;font-weight:700;font-size:16px;margin-bottom:16px}
.toast.show{display:block}.toast.ok{background:var(--green-bg);color:var(--green)}.toast.bad{background:var(--red-bg);color:var(--red)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools input{flex:1;min-width:220px;max-width:380px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font:16px inherit;font-family:inherit;background:var(--white);color:var(--text-dark)}
.chip{border:1px solid var(--border);background:var(--white);color:var(--text-medium);font:600 16px inherit;font-family:inherit;padding:9px 18px;border-radius:99px;cursor:pointer;transition:.15s}
.chip:hover{background:var(--primary-soft)}.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.req{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;padding:20px 0;border-top:1px solid var(--border);flex-wrap:wrap}.req:first-child{border-top:0}
.req .main{display:flex;gap:14px;flex:1;min-width:260px}
.av{width:46px;height:46px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.req .nm{font-size:19px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.req .id{font-size:15px;color:var(--text-muted);font-weight:500}
.tag{font-size:13px;font-weight:700;text-transform:uppercase;padding:3px 12px;border-radius:99px;background:var(--primary-light);color:var(--primary-dark)}
.req .dt{font-size:16px;color:var(--text-muted);margin:3px 0 6px}.req .rs{font-size:17px}.req .nt{font-size:15px;color:var(--text-muted);margin-top:6px;font-style:italic}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ok-btn,.no-btn,.cancel{border:0;border-radius:12px;padding:11px 20px;font:700 16px inherit;font-family:inherit;cursor:pointer;transition:.15s}
.ok-btn{background:var(--green-bg);color:var(--green)}.ok-btn:hover:not(:disabled){background:var(--green);color:#fff}
.no-btn{background:var(--red-bg);color:var(--red)}.no-btn:hover:not(:disabled){background:var(--red);color:#fff}
.cancel{background:var(--white);border:1px solid var(--border);color:var(--text-dark)}
button:disabled{opacity:.55;cursor:not-allowed}
.badge{margin:0;font-size:15px;padding:5px 16px}
.confirm{flex-basis:100%;background:var(--primary-soft);border:1px solid var(--border);border-radius:14px;padding:16px}
.confirm textarea{width:100%;min-height:70px;margin:8px 0;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font:16px inherit;font-family:inherit;background:var(--white);color:var(--text-dark);resize:vertical}
.confirm .warn{font-size:15px;color:var(--amber);font-weight:600}.confirm label{font-weight:700;font-size:16px}
.empty{text-align:center;color:var(--text-muted);padding:40px 0;font-size:17px}.empty.err{color:var(--red);font-weight:600}
@media(max-width:1000px){.sidebar>div:last-child{flex:1}.sidebar>div:last-child .nav-item{flex-direction:column;text-align:center;justify-content:center;gap:2px;padding:8px 2px;font-size:12px}}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>
  <main class="dash-main">
    <div class="dash-topbar">
      <div><p>Review and respond to student requests</p><h1>Leave &amp; OD Requests</h1></div>
      <div class="topbar-right"><div class="profile-pill"><div class="profile-avatar" id="avatarInitial">T</div><span id="profileName">Teacher</span></div></div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="stats-grid" id="stats"></div>
    <div class="panel">
      <div class="tools"><span id="chips"></span><input type="search" id="q" placeholder="Search by student name or ID" aria-label="Search requests"></div>
      <div id="list"><p class="empty">Loading requests...</p></div>
    </div>
  </main>
</div>

<script src="teacher-sidebar.js"></script>
<script>
(function () {
  const API_BASE = "/api", token = localStorage.getItem("token");
  if (!token) { window.location.href = "login-teacher.html"; return; }
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const showDate = (v) => { const d = new Date(v); return isNaN(d) ? esc(v) : d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }); };
  const nDays = (r) => { const n = Math.round((new Date(r.toDate) - new Date(r.fromDate)) / 86400000) + 1; return isNaN(n) || n < 1 ? "" : n + (n === 1 ? " day" : " days"); };
  const STATUS = ["pending", "approved", "rejected"];

  try { const u = JSON.parse(localStorage.getItem("user") || "null"); if (u && u.name) { $("profileName").textContent = u.name.split(" ")[0]; $("avatarInitial").textContent = u.name.charAt(0).toUpperCase(); } } catch (e) {}

  function api(path, options) {
    options = options || {};
    return fetch(API_BASE + path, { ...options, headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token, ...(options.headers || {}) } })
      .then((res) => {
        if (res.status === 401) { localStorage.removeItem("token"); localStorage.removeItem("user"); window.location.href = "login-teacher.html"; return Promise.reject(new Error("Unauthorized")); }
        return res.json().then((data) => ({ status: res.status, data }));
      });
  }
  function toast(msg, ok) { const t = $("toast"); t.textContent = msg; t.className = "toast show " + (ok ? "ok" : "bad"); clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = "toast"; }, 6000); }

  let ALL = [], tab = "pending", open = null, busy = false;       // open = { id, action }

  function render() {
    const c = { all: ALL.length }; STATUS.forEach((s) => { c[s] = ALL.filter((r) => r.status === s).length; });
    $("stats").innerHTML = [["Pending", c.pending, "fa-hourglass-half", "pending"], ["Approved", c.approved, "fa-circle-check", "present"], ["Rejected", c.rejected, "fa-circle-xmark", "absent"], ["All requests", c.all, "fa-file-lines", ""]]
      .map((x) => '<div class="stat-card"><div class="icon ' + x[3] + '"><i class="fa-solid ' + x[2] + '"></i></div><p>' + x[0] + "</p><h3>" + x[1] + "</h3></div>").join("");
    $("chips").innerHTML = ["pending", "approved", "rejected", "all"].map((k) => '<button class="chip' + (k === tab ? " on" : "") + '" data-t="' + k + '" type="button">' + k.charAt(0).toUpperCase() + k.slice(1) + " (" + c[k] + ")</button>").join(" ");
    document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.t; open = null; render(); }));

    const q = $("q").value.trim().toLowerCase();
    let list = ALL.filter((r) => (tab === "all" || r.status === tab) && (!q || ((r.student && (r.student.name + " " + r.student.studentId)) || "").toLowerCase().includes(q)));
    list = list.slice().sort((a, b) => (tab === "pending" ? 1 : -1) * (new Date(a.createdAt) - new Date(b.createdAt)));   // oldest pending first
    if (!list.length) { $("list").innerHTML = '<p class="empty">' + (ALL.length ? "No " + (tab === "all" ? "" : tab + " ") + "requests match." : "No requests yet.") + "</p>"; return; }

    $("list").innerHTML = list.map((r) => {
      const s = r.student || {}, name = s.name || "Unknown student", ini = name.split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase(), st = STATUS.includes(r.status) ? r.status : "pending";
      const acts = st === "pending" ? '<div class="acts"><button class="ok-btn" data-a="approve" data-id="' + r._id + '" type="button">Approve</button><button class="no-btn" data-a="reject" data-id="' + r._id + '" type="button">Reject</button></div>'
        : '<span class="badge ' + st + '">' + st.charAt(0).toUpperCase() + st.slice(1) + "</span>";
      const form = open && open.id === r._id ? '<div class="confirm"><label for="note">Note to the student (optional)</label><textarea id="note" maxlength="300" placeholder="e.g. Approved, please submit the OD certificate"></textarea>' +
        (open.action === "approve" ? '<div class="warn">Approving marks attendance as present for every date in this range.</div>' : "") +
        '<div class="acts" style="margin-top:10px"><button class="' + (open.action === "approve" ? "ok-btn" : "no-btn") + '" id="go" type="button">Confirm ' + open.action + '</button><button class="cancel" id="stop" type="button">Cancel</button></div></div>' : "";
      return '<div class="req"><div class="main"><div class="av">' + esc(ini) + '</div><div><div class="nm">' + esc(name) + '<span class="id">' + esc(s.studentId || "") + '</span><span class="tag">' + (r.type === "od" ? "OD" : "Leave") + '</span></div><div class="dt">' + showDate(r.fromDate) + " — " + showDate(r.toDate) + (nDays(r) ? " · " + nDays(r) : "") + '</div><div class="rs">' + esc(r.reason) + "</div>" + (r.reviewNote ? '<div class="nt">Note: ' + esc(r.reviewNote) + "</div>" : "") + "</div></div>" + (open && open.id === r._id ? "" : acts) + form + "</div>";
    }).join("");
    if (open) { const n = $("note"); if (n) n.focus(); }
  }

  $("list").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b || busy) return;
    if (b.dataset.a) { open = { id: b.dataset.id, action: b.dataset.a }; render(); return; }
    if (b.id === "stop") { open = null; render(); return; }
    if (b.id === "go" && open) {
      busy = true; b.disabled = true; b.textContent = "Saving...";
      const { id, action } = open, note = ($("note").value || "").trim();
      api("/requests/" + id + "/" + action, { method: "PATCH", body: JSON.stringify({ reviewNote: note }) })
        .then(({ status, data }) => {
          if (status !== 200) { toast((data && data.error) || "Could not save. Please try again.", false); return; }
          toast((data && data.message) || "Saved.", true); open = null; return load();
        })
        .catch((err) => { if (err.message !== "Unauthorized") toast("Could not reach the server. Please try again.", false); })
        .finally(() => { busy = false; render(); });
    }
  });
  $("q").addEventListener("input", render);

  function load() {
    return api("/requests").then(({ status, data }) => {
      if (status !== 200 || !Array.isArray(data)) throw new Error((data && data.error) || "Could not load requests.");
      ALL = data; render();
    }).catch((err) => { if (err.message !== "Unauthorized") $("list").innerHTML = '<p class="empty err">' + esc(err.message || "Could not load requests. Is the server running?") + "</p>"; });
  }
  load();
})();
</script>
<script src="theme.js"></script>
</body>
</html>
