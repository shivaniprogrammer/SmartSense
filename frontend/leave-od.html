<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%A8</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Leave &amp; OD | SmartSense</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="student-sidebar.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="student-ui.css">
<style>
.two{display:grid;grid-template-columns:minmax(320px,1fr) 1.4fr;gap:18px;align-items:start}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--border);background:var(--white);color:var(--text-medium);font:600 15px inherit;font-family:inherit;padding:8px 16px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.req{display:flex;justify-content:space-between;gap:14px;padding:16px 0;border-top:1px solid var(--border)}
.req:first-child{border-top:0}
.req .ty{font-size:18px;font-weight:700}.req .dt{font-size:15px;color:var(--text-muted);margin:2px 0 6px}
.req .rs{font-size:16px}.req .nt{font-size:15px;color:var(--text-muted);margin-top:6px;font-style:italic}
.req .badge{margin:0;height:fit-content;font-size:15px;padding:4px 14px}
.empty{text-align:center;color:var(--text-muted);padding:28px 0}
.submit-btn{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font:700 18px inherit;font-family:inherit;cursor:pointer;transition:.2s}
.submit-btn:hover{filter:brightness(1.07)}.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes s{to{transform:rotate(360deg)}}
.form-status{display:none;padding:14px 16px;border-radius:12px;font-size:17px;font-weight:700;margin-bottom:14px}
.form-status.show{display:block}.form-status.success{background:var(--green-bg);color:var(--green)}.form-status.fail{background:var(--red-bg);color:var(--red)}
.bad{border-color:var(--red)!important}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>

  <main class="dash-main">
    <div class="dash-topbar">
      <div><p>Submit a request or track the status of your past ones</p><h1>Leave &amp; OD</h1></div>
      <div class="topbar-right">
        <div class="profile-pill"><div class="profile-avatar" id="avatarInitial">S</div><span id="profileName">Student</span></div>
      </div>
    </div>

    <div class="two">
      <div class="panel">
        <div class="panel-heading"><h4>New application</h4></div>
        <div class="form-status" id="formStatus" role="status"></div>
        <form id="requestForm" novalidate>
          <div class="form-group">
            <label for="type">Type</label>
            <select id="type"><option value="leave">Leave</option><option value="od">On Duty (OD)</option></select>
          </div>
          <div class="date-row">
            <div class="form-group"><label for="fromDate">From</label><input type="date" id="fromDate"><div class="field-err" id="fromErr"></div></div>
            <div class="form-group"><label for="toDate">To</label><input type="date" id="toDate"><div class="field-err" id="toErr"></div></div>
          </div>
          <div class="form-group">
            <label for="reason">Reason</label>
            <textarea id="reason" placeholder="Briefly explain the reason..."></textarea>
            <div class="field-err" id="reasonErr"></div>
          </div>
          <button type="submit" class="submit-btn" id="submitBtn">Submit application</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel-heading"><h4>Application history</h4></div>
        <div class="chips" id="chips"></div>
        <div id="requestsList"><p class="empty">Loading your requests...</p></div>
      </div>
    </div>
  </main>
</div>

<script src="student-sidebar.js"></script>
<script>
const API_BASE = "/api";
const token = localStorage.getItem("token");
if (!token) window.location.href = "login-student.html";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const showDate = (v) => { const d = new Date(v); return isNaN(d) ? esc(v) : d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }); };
const STATUSES = ["pending", "approved", "rejected"];

try { const u = JSON.parse(localStorage.getItem("user") || "null"); if (u && u.name) { $("profileName").textContent = u.name.split(" ")[0]; $("avatarInitial").textContent = u.name.charAt(0).toUpperCase(); } } catch (e) {}

function authFetch(path, options = {}) {
  return fetch(API_BASE + path, { ...options, headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token, ...(options.headers || {}) } })
    .then((res) => {
      if (res.status === 401) { localStorage.removeItem("token"); localStorage.removeItem("user"); window.location.href = "login-student.html"; return Promise.reject(new Error("Unauthorized")); }
      return res.json().then((data) => ({ status: res.status, data }));
    });
}

/* ---------- history ---------- */
let REQUESTS = [], filter = "all";

function renderList() {
  const counts = { all: REQUESTS.length };
  STATUSES.forEach((s) => { counts[s] = REQUESTS.filter((r) => r.status === s).length; });
  $("chips").innerHTML = ["all"].concat(STATUSES).map((s) =>
    '<button class="chip' + (s === filter ? " on" : "") + '" data-f="' + s + '" type="button">' + s.charAt(0).toUpperCase() + s.slice(1) + " (" + counts[s] + ")</button>").join("");
  document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.f; renderList(); }));

  const list = filter === "all" ? REQUESTS : REQUESTS.filter((r) => r.status === filter);
  if (!list.length) { $("requestsList").innerHTML = '<p class="empty">' + (REQUESTS.length ? "No " + filter + " requests." : "You haven’t submitted any requests yet.") + "</p>"; return; }
  $("requestsList").innerHTML = list.map((r) => {
    const st = STATUSES.includes(r.status) ? r.status : "pending";
    return '<div class="req"><div><div class="ty">' + (r.type === "od" ? "On Duty (OD)" : "Leave") + '</div><div class="dt">' + showDate(r.fromDate) + " — " + showDate(r.toDate) +
      '</div><div class="rs">' + esc(r.reason) + "</div>" + (r.reviewNote ? '<div class="nt">Note: ' + esc(r.reviewNote) + "</div>" : "") +
      '</div><span class="badge ' + st + '">' + st.charAt(0).toUpperCase() + st.slice(1) + "</span></div>";
  }).join("");
}

function loadRequests() {
  return authFetch("/requests/mine")
    .then(({ status, data }) => {
      if (status !== 200 || !Array.isArray(data)) throw new Error("HTTP " + status);
      REQUESTS = data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      renderList();
      // the student has now seen every update: clear the sidebar dot
      localStorage.setItem("notifLastSeen", new Date().toISOString());
      const dot = document.getElementById("notifDot");
      if (dot) dot.classList.remove("show");
    })
    .catch((e) => { if (e.message !== "Unauthorized") $("requestsList").innerHTML = '<p class="empty" style="color:var(--red);font-weight:600">Could not load your requests. Is the server running?</p>'; });
}

/* ---------- form ---------- */
const form = $("requestForm"), fStatus = $("formStatus"), btn = $("submitBtn");
let submitting = false;

function validate(v) {
  const e = {};
  if (!v.fromDate) e.from = "From date is required.";
  if (!v.toDate) e.to = "To date is required.";
  else if (v.fromDate && v.toDate < v.fromDate) e.to = "To date can’t be before the from date.";
  if (v.reason.length < 5) e.reason = "Please give a short reason (at least 5 characters).";
  $("fromErr").textContent = e.from || ""; $("toErr").textContent = e.to || ""; $("reasonErr").textContent = e.reason || "";
  $("fromDate").classList.toggle("bad", !!e.from); $("toDate").classList.toggle("bad", !!e.to); $("reason").classList.toggle("bad", !!e.reason);
  return Object.keys(e).length === 0;
}

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (submitting) return;                                  // duplicate-submit guard
  const v = { type: $("type").value, fromDate: $("fromDate").value, toDate: $("toDate").value, reason: $("reason").value.trim() };
  fStatus.className = "form-status";
  if (!validate(v)) return;

  submitting = true; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Submitting...';

  authFetch("/requests", { method: "POST", body: JSON.stringify(v) })
    .then(({ status, data }) => {
      if (status !== 201) {                                // only a real 201 is success
        fStatus.textContent = (data && data.error) || "Could not submit your application. Please try again.";
        fStatus.className = "form-status show fail";
        return;
      }
      fStatus.textContent = (v.type === "od" ? "OD" : "Leave") + " application submitted successfully!";
      fStatus.className = "form-status show success";
      form.reset(); filter = "all";
      return loadRequests();                               // history shows the status the backend returned
    })
    .catch((e) => {
      if (e && e.message === "Unauthorized") return;
      fStatus.textContent = "Could not reach the server. Your application was not sent, so please try again.";
      fStatus.className = "form-status show fail";
    })
    .finally(() => { submitting = false; btn.disabled = false; btn.textContent = "Submit application"; });
});

loadRequests();
</script>
<script src="theme.js"></script>
</body>
</html>
