<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%A8</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Attendance | SmartSense</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="student-sidebar.css">
<link rel="stylesheet" href="theme.css">
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

:root {
  --primary: #0f9fa8;
  --primary-dark: #087f86;
  --primary-light: #dff7f8;
  --primary-soft: #eefafb;
  --white: #ffffff;
  --background: #f7fbfc;
  --text-dark: #14212b;
  --text-medium: #465963;
  --text-muted: #72818a;
  --border: #d9ecee;
  --green: #1f9d55;
  --green-bg: #e5f7ec;
  --amber: #b7791f;
  --amber-bg: #fff6e0;
  --red: #e45858;
  --red-bg: #ffeaea;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Inter", sans-serif; background: var(--background); color: var(--text-dark); }

.layout { display: flex; min-height: 100vh; }

.topbar {
  height: 70px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 5%;
}

.profile-pill {
  display: flex; align-items: center; gap: 10px;
  background: var(--primary-soft); padding: 6px 14px 6px 6px; border-radius: 100px;
}
.profile-pill .avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--primary); color: white; display: flex; align-items: center;
  justify-content: center; font-size: 12px; font-weight: 700;
}
.profile-pill span { font-size: 13px; font-weight: 600; }

.main-content { flex: 1; }

.container { max-width: 1100px; margin: 0 auto; padding: 40px 5%; }

.page-heading { margin-bottom: 28px; }
.page-heading h1 { font-size: 26px; margin-bottom: 4px; }
.page-heading p { color: var(--text-muted); font-size: 13px; }

.summary-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px;
}
.summary-card {
  background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 18px;
}
.summary-card .label { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
.summary-card .value { font-size: 24px; font-weight: 700; }
.summary-card.present .value { color: var(--green); }
.summary-card.late .value { color: var(--amber); }
.summary-card.absent .value { color: var(--red); }
.summary-card.percent .value { color: var(--primary); }

.panel {
  background: var(--white); border: 1px solid var(--border); border-radius: 16px;
  padding: 24px; margin-bottom: 20px;
}
.panel-heading {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;
}
.panel-heading h3 { font-size: 16px; }
.panel-heading .filter {
  font-size: 12px; color: var(--text-muted); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 8px; cursor: pointer;
}

table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 11px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.5px; padding: 10px 12px; border-bottom: 1px solid var(--border);
}
td { padding: 14px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }

.status-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 100px; font-size: 11px; font-weight: 600;
}
.status-badge.present { background: var(--green-bg); color: var(--green); }
.status-badge.late { background: var(--amber-bg); color: var(--amber); }
.status-badge.absent { background: var(--red-bg); color: var(--red); }

.status-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.method-tag {
  font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;
}

@media (max-width: 700px) {
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  table { font-size: 11px; }
  th, td { padding: 8px 6px; }
}
</style>
</head>
<body>

<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main-content">

    <header class="topbar">
      <div class="profile-pill">
        <div class="avatar">S</div>
        <span>Shivani S.</span>
      </div>
    </header>

    <div class="container">

      <div class="page-heading">
        <h1>My Attendance</h1>
        <p>Your attendance record for this month</p>
      </div>

      <!-- Summary cards - mock data, not yet wired to backend -->
      <div class="summary-grid">
       <div class="summary-card percent">
    <div class="label">Attendance %</div>
    <div id="attendancePercent" class="value">--</div>
</div>

<div class="summary-card present">
    <div class="label">Days Present</div>
    <div id="presentDays" class="value">--</div>
</div>

<div class="summary-card late">
    <div class="label">Days Late</div>
    <div id="lateDays" class="value">--</div>
</div>

<div class="summary-card absent">
    <div class="label">Days Absent</div>
    <div id="absentDays" class="value">--</div>
</div>

      <!-- Attendance history - mock data, not yet wired to backend -->
      <div class="panel">
        <div class="panel-heading">
          <h3>Attendance History</h3>
        </div>

        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Check-in</th>
              <th>Check-out</th>
              <th>Method</th>
              <th>Status</th>
            </tr>
          </thead>
        <tbody id="attendanceTableBody">
    <tr>
        <td colspan="5" style="text-align:center;">Loading attendance...</td>
    </tr>
</tbody>
        </table>
      </div>

    </div>

  </div>

</div>

<script src="student-sidebar.js"></script>
<script src="theme.js"></script>
<script>
const SPRING_API_BASE = "http://localhost:8080";

const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "login-student.html";
}

function authFetch(path) {
    return fetch("/api" + path, {
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        }
    }).then(function(res) {
        return res.json().then(function(data) {
            return {
                status: res.status,
                data: data
            };
        });
    });
}

function formatDate(dateString) {
    if (!dateString) return "—";

    const date = new Date(dateString + "T00:00:00");

    return date.toLocaleDateString("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric"
    });
}

function formatTime(dateTimeString) {
    if (!dateTimeString) return "—";

    const date = new Date(dateTimeString);

    return date.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit"
    });
}

function getMethodHtml(method) {
    if (!method) {
        return '<span class="method-tag">—</span>';
    }

    if (method.toLowerCase() === "ble") {
        return '<span class="method-tag"><i class="fa-solid fa-bluetooth-b"></i> BLE</span>';
    }

    if (method.toLowerCase() === "manual") {
        return '<span class="method-tag"><i class="fa-solid fa-user-check"></i> Manual</span>';
    }

    return '<span class="method-tag">' + method + '</span>';
}

function getStatusHtml(status) {
    const cleanStatus = status ? status.toLowerCase() : "absent";

    return `
        <span class="status-badge ${cleanStatus}">
            <span class="dot"></span>
            ${cleanStatus.charAt(0).toUpperCase() + cleanStatus.slice(1)}
        </span>
    `;
}

function loadAttendance(profile) {

    fetch(SPRING_API_BASE + "/attendance/student/" + profile._id)
        .then(function(res) {
            if (!res.ok) {
                throw new Error("Spring Boot returned " + res.status);
            }

            return res.json();
        })
        .then(function(records) {

            console.log("Attendance from Spring Boot:", records);

            let presentCount = 0;
            let lateCount = 0;
            let absentCount = 0;

            records.forEach(function(record) {

                if (record.status === "present") {
                    presentCount++;
                }
                else if (record.status === "late") {
                    lateCount++;
                }
                else if (record.status === "absent") {
                    absentCount++;
                }
            });

            const total = records.length;

            const attendanceCount = presentCount + lateCount;

            const percentage = total > 0
                ? Math.round((attendanceCount / total) * 1000) / 10
                : 0;

            document.getElementById("attendancePercent").textContent =
                percentage + "%";

            document.getElementById("presentDays").textContent =
                presentCount;

            document.getElementById("lateDays").textContent =
                lateCount;

            document.getElementById("absentDays").textContent =
                absentCount;

            const tableBody =
                document.getElementById("attendanceTableBody");

            tableBody.innerHTML = "";

            if (records.length === 0) {

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align:center;">
                            No attendance records found.
                        </td>
                    </tr>
                `;

                return;
            }

            records.sort(function(a, b) {
                return new Date(b.date) - new Date(a.date);
            });

            records.forEach(function(record) {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${formatDate(record.date)}</td>

                    <td>${formatTime(record.checkInTime)}</td>

                    <td>${formatTime(record.checkOutTime)}</td>

                    <td>${getMethodHtml(record.method)}</td>

                    <td>${getStatusHtml(record.status)}</td>
                `;

                tableBody.appendChild(row);
            });
        })
        .catch(function(error) {

            console.error(
                "Failed to load attendance history:",
                error
            );

            document.getElementById("attendanceTableBody").innerHTML = `
                <tr>
                    <td colspan="5" style="text-align:center;">
                        Could not load attendance.
                    </td>
                </tr>
            `;
        });
}

authFetch("/students/me")
    .then(function(result) {

        if (result.status === 401) {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "login-student.html";
            return;
        }

        const profile = result.data;

        console.log("Logged-in student:", profile);

        loadAttendance(profile);
    })
    .catch(function(error) {

        console.error(
            "Failed to load student profile:",
            error
        );
    });
</script>
</body>
</html>
