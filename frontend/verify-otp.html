<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%A8</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email | SmartSense</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --primary-light: #eef0ff;
  --background: #f6f7fb;
  --white: #ffffff;
  --text-dark: #1a1d29;
  --text-muted: #7a7f92;
  --border: #ececf3;
  --red: #e0473e;
  --red-bg: #fdeceb;
  --green: #16a34a;
  --green-bg: #e8f8ee;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Inter", sans-serif; background: var(--background); color: var(--text-dark);
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
}

.card {
  background: var(--white); border: 1px solid var(--border); border-radius: 20px;
  padding: 40px 36px; width: 100%; max-width: 420px; text-align: center;
}

.icon-badge {
  width: 60px; height: 60px; border-radius: 16px; background: var(--primary-light);
  color: var(--primary); display: flex; align-items: center; justify-content: center;
  font-size: 24px; margin: 0 auto 20px;
}

h1 { font-size: 20px; margin-bottom: 8px; }
.subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
.email-display { font-size: 13px; font-weight: 600; color: var(--text-dark); margin-bottom: 28px; }

.otp-inputs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
.otp-inputs input {
  width: 46px; height: 54px; text-align: center; font-size: 20px; font-weight: 700;
  border: 1.5px solid var(--border); border-radius: 10px; outline: none;
  transition: border-color 0.15s;
}
.otp-inputs input:focus { border-color: var(--primary); }

.message { font-size: 12px; margin-bottom: 16px; min-height: 16px; }
.message.error { color: var(--red); }
.message.success { color: var(--green); }

.verify-btn {
  width: 100%; padding: 13px; border: none; border-radius: 10px;
  background: var(--primary); color: white; font-size: 14px; font-weight: 700;
  cursor: pointer; margin-bottom: 16px;
}
.verify-btn:hover { background: var(--primary-dark); }
.verify-btn:disabled { opacity: 0.6; cursor: not-allowed; }

.resend-row { font-size: 12px; color: var(--text-muted); }
.resend-link { color: var(--primary); font-weight: 600; cursor: pointer; }
.resend-link.disabled { color: var(--text-muted); cursor: not-allowed; }
</style>
</head>
<body>

<div class="card">
  <div class="icon-badge"><i class="fa-solid fa-envelope-open-text"></i></div>
  <h1>Verify your email</h1>
  <p class="subtitle">We sent a 6-digit code to</p>
  <p class="email-display" id="emailDisplay">your email</p>

  <div class="otp-inputs" id="otpInputs">
    <input type="text" maxlength="1" inputmode="numeric">
    <input type="text" maxlength="1" inputmode="numeric">
    <input type="text" maxlength="1" inputmode="numeric">
    <input type="text" maxlength="1" inputmode="numeric">
    <input type="text" maxlength="1" inputmode="numeric">
    <input type="text" maxlength="1" inputmode="numeric">
  </div>

  <p class="message" id="message"></p>

  <button class="verify-btn" id="verifyBtn">Verify Email</button>

  <p class="resend-row">
    Didn't get the code?
    <span class="resend-link" id="resendLink">Resend code</span>
    <span id="resendTimer"></span>
  </p>
</div>

<script>
   const API_BASE = "/api";

const params = new URLSearchParams(window.location.search);
const email = params.get("email") || "";
const role = params.get("role") || "student";
document.getElementById("emailDisplay").textContent = email || "your email";

const inputs = document.querySelectorAll("#otpInputs input");
const messageEl = document.getElementById("message");
const verifyBtn = document.getElementById("verifyBtn");
const resendLink = document.getElementById("resendLink");
const resendTimer = document.getElementById("resendTimer");

inputs.forEach((input, index) => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/[^0-9]/g, "");
    if (input.value && index < inputs.length - 1) {
      inputs[index + 1].focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !input.value && index > 0) {
      inputs[index - 1].focus();
    }
  });

  input.addEventListener("paste", (e) => {
    e.preventDefault();
    const pasted = e.clipboardData.getData("text").replace(/[^0-9]/g, "").slice(0, 6);
    pasted.split("").forEach((digit, i) => {
      if (inputs[i]) inputs[i].value = digit;
    });
    if (pasted.length === 6) inputs[5].focus();
  });
});

function getEnteredCode() {
  return Array.from(inputs).map((i) => i.value).join("");
}

function showMessage(text, type) {
  messageEl.textContent = text;
  messageEl.className = "message " + type;
}

verifyBtn.addEventListener("click", async () => {
  const otp = getEnteredCode();

  if (otp.length !== 6) {
    showMessage("Please enter all 6 digits.", "error");
    return;
  }

  verifyBtn.disabled = true;
  verifyBtn.textContent = "Verifying...";

  try {
  const res = await fetch(`${API_BASE}/auth/verify-otp`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, otp }),
    });
    const data = await res.json();

    if (res.ok) {
      showMessage(data.message || "Email verified!", "success");
      const redirectPage = role === "teacher" ? "login-teacher.html" : "login-student.html";
      setTimeout(() => {
        window.location.href = redirectPage;
      }, 1200);
    } else {
      showMessage(data.error || "Verification failed.", "error");
      verifyBtn.disabled = false;
      verifyBtn.textContent = "Verify Email";
    }
  } catch (err) {
    showMessage("Could not reach the server. Is your backend running?", "error");
    verifyBtn.disabled = false;
    verifyBtn.textContent = "Verify Email";
  }
});

let cooldown = 0;
function startCooldown() {
  cooldown = 30;
  resendLink.classList.add("disabled");
  const interval = setInterval(() => {
    cooldown--;
    resendTimer.textContent = cooldown > 0 ? `(${cooldown}s)` : "";
    if (cooldown <= 0) {
      clearInterval(interval);
      resendLink.classList.remove("disabled");
    }
  }, 1000);
}

resendLink.addEventListener("click", async () => {
  if (resendLink.classList.contains("disabled")) return;

  try {
    const res = await fetch(`${API_BASE}/auth/resend-otp`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    showMessage(data.message || "New code sent.", res.ok ? "success" : "error");
    if (res.ok) startCooldown();
  } catch (err) {
    showMessage("Could not reach the server.", "error");
  }
});

startCooldown();
inputs[0].focus();
</script>

</body>
</html>
