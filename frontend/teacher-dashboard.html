<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%A8</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Teacher Dashboard | SmartSense</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="teacher-sidebar.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="student-ui.css">
<style>
.date-pill{background:var(--primary-light);color:var(--primary-dark);padding:10px 18px;border-radius:12px;font-size:16px;font-weight:700}
.btn{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:10px 16px;font:600 16px inherit;font-family:inherit;cursor:pointer;color:var(--text-dark);transition:.2s}
.btn:hover{border-color:var(--primary)}.btn:disabled{opacity:.5;cursor:not-allowed}
.bell{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--white);display:grid;place-items:center;color:var(--text-medium);text-decoration:none;font-size:18px}
.bell .count{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center}
.bell .count.show{display:flex}.topbar-right{flex-wrap:wrap}
.toast{display:none;padding:14px 18px;border-radius:12px;font-weight:700;font-size:16px;margin-bottom:16px}
.toast.show{display:block}.toast.ok{background:var(--green-bg);color:var(--green)}.toast.bad{background:var(--red-bg);color:var(--red)}
.demo-note{background:var(--amber-bg);color:var(--amber);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;margin-bottom:16px}
.stats-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tab{border:1px solid var(--border);background:var(--white);color:var(--text-medium);font:600 17px inherit;font-family:inherit;padding:10px 20px;border-radius:99px;cursor:pointer;transition:.15s}
.tab:hover{background:var(--primary-soft)}.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.periods{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.period{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--border);border-left:5px solid var(--primary);border-radius:14px;background:var(--primary-soft);cursor:pointer;transition:.15s;text-align:left;font:inherit;font-family:inherit;color:inherit}
.period:hover{box-shadow:0 8px 22px rgba(11,31,58,.1);transform:translateY(-1px)}
.period.other{border-left-color:#3B82F6}.period.now{background:var(--primary-light);box-shadow:0 0 0 2px var(--primary)}
.period .tm{font-size:16px;color:var(--text-muted);font-weight:600}.period .sj{font-size:20px;font-weight:700;line-height:1.25}
.period .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--text-muted)}
.code{background:var(--primary);color:#fff;font-size:14px;font-weight:700;padding:3px 12px;border-radius:99px}.code.other{background:#3B82F6}
.meter{height:10px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:4px}.meter span{display:block;height:100%;background:var(--primary);border-radius:99px}
.cnt{display:flex;gap:12px;font-size:15px;font-weight:700}.cnt .p{color:var(--green)}.cnt .l{color:var(--amber)}.cnt .a{color:var(--red)}
.dnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.dnav input{padding:10px 12px;border:1px solid var(--border);border-radius:12px;font:16px inherit;font-family:inherit;background:var(--white);color:var(--text-dark)}
.trend{display:flex;align-items:flex-end;gap:12px;height:200px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.tbar{width:100%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--primary),var(--primary-dark));min-height:4px}
.tcol b{font-size:16px}.tcol span{font-size:14px;color:var(--text-muted)}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--primary);font:700 17px inherit;font-family:inherit;background:none;border:0;cursor:pointer;margin-bottom:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input{flex:1;min-width:200px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font:16px inherit;font-family:inherit;background:var(--white);color:var(--text-dark)}
.chip{border:1px solid var(--border);background:var(--white);color:var(--text-medium);font:600 15px inherit;font-family:inherit;padding:8px 16px;border-radius:99px;cursor:pointer}.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:17px}
th{text-align:left;font-size:14px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;padding:12px 10px;border-bottom:1px solid var(--border)}
td{padding:13px 10px;border-bottom:1px solid var(--border)}tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:12px}.av{width:40px;height:40px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.pill{display:inline-flex;align-items:center;padding:4px 14px;border-radius:99px;font-size:15px;font-weight:700}
.pill.present{background:var(--green-bg);color:var(--green)}.pill.late{background:var(--amber-bg);color:var(--amber)}.pill.absent{background:var(--red-bg);color:var(--red)}.pill.unverified{background:var(--border);color:var(--text-medium)}
.empty{color:var(--text-muted);padding:18px 4px;font-size:16px}.empty.err{color:var(--red);font-weight:600}.sec{margin-bottom:18px}
@media(max-width:1000px){.sidebar>div:last-child{flex:1}.sidebar>div:last-child .nav-item{flex-direction:column;text-align:center;justify-content:center;gap:2px;padding:8px 2px;font-size:12px}}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>
  <main class="dash-main">
    <div class="dash-topbar">
      <div><p id="dashboardSubtitle">Live attendance overview</p><h1>Teacher Dashboard</h1></div>
      <div class="topbar-right">
        <button class="btn" id="alertBtn" type="button"><i class="fa-solid fa-triangle-exclamation" style="color:var(--red)"></i> Send Low Attendance Alerts</button>
        <span class="date-pill" id="datePill"></span>
        <a href="teacher-requests.html" class="bell" aria-label="Leave and OD requests"><i class="fa-solid fa-bell"></i><span class="count" id="notifCount"></span></a>
        <div class="profile-pill"><div class="profile-avatar" id="avatarInitial">T</div><span id="profileName">Teacher</span></div>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="demo-note" id="demoNote" hidden></div>

    <div id="listView">
      <div class="stats-grid" id="stats"></div>

      <div class="panel sec">
        <div class="panel-heading"><h4>My timetable</h4><span class="note">Tap a period to see its attendance</span></div>
        <div class="tabs" id="tabs"></div>
        <div id="periods"><p class="empty">Loading your timetable...</p></div>
      </div>

      <div class="panel sec">
        <div class="panel-heading"><h4>Weekly attendance trend</h4><span class="note">Students present or late each day</span></div>
        <div class="trend" id="trend"><p class="empty">Loading...</p></div>
      </div>
    </div>

    <div id="sessionView" style="display:none">
      <button class="back" id="backBtn" type="button"><i class="fa-solid fa-arrow-left"></i> Back</button>
      <div class="panel">
        <div class="panel-heading"><h4 id="sessionTitle">Attendance</h4><button class="btn" id="refreshBtn" type="button"><i class="fa-solid fa-rotate"></i> Refresh</button></div>
        <div class="stats-grid" id="sessStats"></div>
        <div class="tools"><input type="search" id="q" placeholder="Search student name" aria-label="Search student"><span id="chips"></span></div>
        <div class="scroll"><table><thead><tr><th>Student</th><th>Check-in</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
      </div>
    </div>
  </main>
</div>

<script src="teacher-sidebar.js"></script>
<script src="timetable-data.js"></script>
<script src="teacher-sample.js"></script>
<script>
(function () {
  /* ====== SETTINGS ======
     true  = show clearly-labelled SAMPLE attendance.
     false = use the real server endpoints only (LIVE DATA).                                       */
  const USE_DEMO_DATA = false;
  const MY_CLASS = "CSE F";                                // used until the account reports its own coordinatorClass

  const API_BASE = "/api";
  const token = localStorage.getItem("token");
  if (!token) { window.location.href = "login-teacher.html"; return; }
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const num = (v) => (v == null ? "--" : v);

  function api(path, options) {
    options = options || {};
    return fetch(API_BASE + path, { ...options, headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token, ...(options.headers || {}) } })
      .then((res) => {
        if (res.status === 401) { localStorage.removeItem("token"); localStorage.removeItem("user"); window.location.href = "login-teacher.html"; return Promise.reject(new Error("Unauthorized")); }
        return res.json().then((data) => ({ status: res.status, data }));
      });
  }
  function toast(msg, ok) { const t = $("toast"); t.textContent = msg; t.className = "toast show " + (ok ? "ok" : "bad"); clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = "toast"; }, 6000); }

  const todayD = new Date(); todayD.setHours(0, 0, 0, 0);
  $("datePill").textContent = todayD.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  try { const u = JSON.parse(localStorage.getItem("user") || "null"); if (u && u.name) { $("profileName").textContent = u.name.split(" ")[0]; $("avatarInitial").textContent = u.name.charAt(0).toUpperCase(); } } catch (e) {}

  /* ---------- sample data (shared with the Reports page via teacher-sample.js) ---------- */
  const sampleRecords = TS.records, sampleDay = TS.day;
  function sampleEntries() {                               // her own teaching only: Java (OOPJ) in several sections
    const D = ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY"], out = [], f = (h, m) => (h > 12 ? h - 12 : h) + ":" + String(m).padStart(2, "0");
    const add = (di, p1, p2, sec, lab) => { const a = SS.PER[p1 - 1], b = SS.PER[p2 - 1]; out.push({ day: D[di], startTime: f(a[0], a[1]), endTime: f(b[2], b[3]), subject: "Object Oriented Programming using Java" + (lab ? " Lab" : ""), subjectCode: "OOPJ", classSection: sec, room: sec === MY_CLASS && !lab ? SS.room : "" }); };
    add(0, 7, 8, "CSE F", true); add(1, 6, 6, "CSE F"); add(2, 4, 5, "CSE F", true); add(4, 3, 3, "CSE F");   // CSE F: from the college timetable
    add(0, 1, 1, "IT A"); add(1, 7, 7, "IT A"); add(2, 3, 3, "IT A"); add(3, 7, 7, "IT A");                  // the rest are sample slots
    add(1, 2, 2, "IT B"); add(2, 6, 6, "IT B"); add(3, 5, 5, "IT B"); add(4, 5, 5, "IT B");
    add(0, 3, 3, "CSE A"); add(3, 2, 2, "CSE A"); add(4, 6, 6, "CSE A");
    add(0, 6, 6, "CSE C"); add(2, 1, 1, "CSE C"); add(4, 1, 1, "CSE C");
    add(1, 4, 4, "CSE G"); add(3, 3, 3, "CSE G");
    return out;
  }

  /* ---------- stats ---------- */
  const S = { total: "--", present: "--", late: "--", absent: "--", pending: "--" };
  function renderStats() {
    $("stats").innerHTML = [["Students", S.total, "fa-users", ""], ["Present", S.present, "fa-user-check", "present"], ["Late", S.late, "fa-clock", "pending"], ["Absent", S.absent, "fa-user-xmark", "absent"], ["Pending requests", S.pending, "fa-hourglass-half", "pending"]]
      .map((x) => '<div class="stat-card"><div class="icon ' + x[3] + '"><i class="fa-solid ' + x[2] + '"></i></div><p>' + x[0] + "</p><h3>" + x[1] + "</h3></div>").join("");
  }
  renderStats();

  /* ---------- timetable ---------- */
  const DAYS = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
  const LABEL = (d) => d.charAt(0) + d.slice(1).toLowerCase();
  const todayKey = DAYS[todayD.getDay()];
  let ENTRIES = [], selDay = null, myClass = MY_CLASS, sampleTT = false;

  function mins(t) {
    const m = String(t || "").match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i); if (!m) return null;
    let h = +m[1]; const ap = (m[3] || "").toUpperCase();
    if (ap === "PM" && h < 12) h += 12; if (ap === "AM" && h === 12) h = 0; if (!ap && h < 8) h += 12;
    return h * 60 + +m[2];
  }
  const byTime = (a, b) => (mins(a.startTime) || 0) - (mins(b.startTime) || 0);
  const liveIdx = (list) => { const n = new Date().getHours() * 60 + new Date().getMinutes(); return list.findIndex((e) => { const x = mins(e.endTime); return x !== null && x > n; }); };

  function renderTimetable() {
    if (!ENTRIES.length) { $("tabs").innerHTML = ""; $("periods").innerHTML = '<p class="empty">No timetable periods assigned yet. Contact the admin if this looks wrong.</p>'; return; }
    const days = DAYS.slice(1).concat(DAYS[0]).filter((d) => ENTRIES.some((e) => e.day === d));
    if (!selDay || !days.includes(selDay)) selDay = days.includes(todayKey) ? todayKey : days[0];
    $("tabs").innerHTML = days.map((d) => '<button class="tab' + (d === selDay ? " on" : "") + '" data-d="' + d + '" type="button">' + LABEL(d) + (d === todayKey ? " · today" : "") + "</button>").join("");
    document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => { selDay = b.dataset.d; renderTimetable(); }));
    const list = ENTRIES.filter((e) => e.day === selDay).sort(byTime), live = selDay === todayKey ? liveIdx(list) : -1;
    $("periods").innerHTML = '<div class="periods">' + list.map((e, i) => {
      const own = e.classSection === myClass;
      return '<button class="period' + (own ? "" : " other") + (i === live ? " now" : "") + '" data-i="' + ENTRIES.indexOf(e) + '" type="button"><span class="tm">' + esc(e.startTime) + " – " + esc(e.endTime) + '</span><span class="sj">' + esc(e.subject || e.subjectCode) +
        '</span><span class="meta"><span class="code' + (own ? "" : " other") + '">' + esc(e.classSection) + "</span><span>" + (own ? "My class" : "Teaching") + "</span>" + (e.room ? "<span>Room " + esc(e.room) + "</span>" : "") + "</span></button>";
    }).join("") + "</div>";
    document.querySelectorAll("#periods .period").forEach((b) => b.addEventListener("click", () => {
      const e = ENTRIES[+b.dataset.i], title = (e.subject || e.subjectCode) + " — " + e.classSection;
      openSession(title, sampleTT ? () => Promise.resolve(sampleRecords(e.classSection, e.subjectCode, iso(todayD), mins(e.startTime) || 0)) : () => realRecords(e.classSection, e.subjectCode, iso(todayD)));
    }));
  }

  function realRecords(section, code, day) {
    return api("/attendance?classSection=" + encodeURIComponent(section) + "&subject=" + encodeURIComponent(code) + "&date=" + day)
      .then(({ status, data }) => { if (status !== 200) throw new Error((data && data.error) || "Could not load attendance."); return data.records || []; });
  }

  /* ---------- weekly trend ---------- */
  function renderTrend(items) {
    if (!items.length) { $("trend").innerHTML = '<p class="empty">No data yet.</p>'; return; }
    const max = Math.max.apply(null, items.map((x) => x.n).concat([1]));
    $("trend").innerHTML = items.map((x) => '<div class="tcol"><b>' + x.n + '</b><div class="tbar" style="height:' + Math.max(2, (x.n / max) * 78) + '%"></div><span>' + esc(x.label) + "</span></div>").join("");
  }
  const dayLabel = (s) => new Date(s + "T00:00:00").toLocaleDateString("en-IN", { weekday: "short" });

  /* ---------- session view ---------- */
  let RECORDS = [], status = "all", cur = null;
  function renderSession() {
    const c = { present: 0, late: 0, absent: 0 }; RECORDS.forEach((r) => { if (c[r.status] !== undefined) c[r.status]++; });
    const total = RECORDS.length, pct = total ? Math.round(((c.present + c.late) / total) * 1000) / 10 : 0;
    $("sessStats").innerHTML = [["Students", total, "fa-users", ""], ["Present", c.present, "fa-user-check", "present"], ["Late", c.late, "fa-clock", "pending"], ["Absent", c.absent, "fa-user-xmark", "absent"]]
      .map((x) => '<div class="stat-card"><div class="icon ' + x[3] + '"><i class="fa-solid ' + x[2] + '"></i></div><p>' + x[0] + "</p><h3>" + x[1] + "</h3></div>").join("");
    $("sessionTitle").textContent = cur.title + (total ? " · " + pct + "% attended" : "");
    const keys = ["all", "present", "late", "absent", "unverified"].filter((k) => k === "all" || RECORDS.some((r) => r.status === k));
    $("chips").innerHTML = keys.map((k) => '<button class="chip' + (k === status ? " on" : "") + '" data-s="' + k + '" type="button">' + k.charAt(0).toUpperCase() + k.slice(1) + "</button>").join(" ");
    document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { status = b.dataset.s; renderSession(); }));
    const q = $("q").value.trim().toLowerCase();
    const list = RECORDS.filter((r) => (status === "all" || r.status === status) && (!q || String((r.student && r.student.name) || "").toLowerCase().includes(q)));
    $("rows").innerHTML = list.length ? list.map((r) => {
      const name = (r.student && r.student.name) || "Unknown", st = ["present", "late", "absent"].includes(r.status) ? r.status : "unverified", t = r.checkInTime ? new Date(r.checkInTime) : null;
      return '<tr><td><div class="who"><div class="av">' + esc(name.split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase()) + "</div><div>" + esc(name) + (r.student && r.student.studentId ? '<div class="note">' + esc(r.student.studentId) + "</div>" : "") + "</div></div></td><td>" + (t && !isNaN(t) ? t.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : "—") + '</td><td><span class="pill ' + st + '">' + st.charAt(0).toUpperCase() + st.slice(1) + "</span></td></tr>";
    }).join("") : '<tr><td colspan="3" class="empty">' + (RECORDS.length ? "No students match." : "No attendance recorded yet for this session.") + "</td></tr>";
  }
  function loadSession() {
    $("rows").innerHTML = '<tr><td colspan="3" class="empty">Loading attendance...</td></tr>';
    return cur.provider().then((r) => { RECORDS = r; renderSession(); })
      .catch((e) => { if (e.message !== "Unauthorized") { RECORDS = []; $("sessStats").innerHTML = ""; $("rows").innerHTML = '<tr><td colspan="3" class="empty err">' + esc(e.message || "Could not reach the server.") + "</td></tr>"; } });
  }
  function openSession(title, provider) {
    cur = { title, provider }; status = "all"; $("q").value = ""; RECORDS = []; $("chips").innerHTML = ""; $("sessStats").innerHTML = "";
    $("sessionTitle").textContent = title; $("listView").style.display = "none"; $("sessionView").style.display = "block"; window.scrollTo(0, 0); loadSession();
  }
  $("backBtn").addEventListener("click", () => { $("sessionView").style.display = "none"; $("listView").style.display = "block"; });
  $("refreshBtn").addEventListener("click", loadSession);
  $("q").addEventListener("input", renderSession);

  /* ---------- load everything ---------- */
  function showNote() {
    $("demoNote").hidden = true;
}

  api("/auth/me").then(({ data }) => {
    const a = data && data.user; if (!a) return;
    if (a.name) { $("profileName").textContent = a.name.split(" ")[0]; $("avatarInitial").textContent = a.name.charAt(0).toUpperCase(); }
    if (a.coordinatorClass) { myClass = a.coordinatorClass; renderTimetable(); }
    const sub = $("dashboardSubtitle");
    if (a.facultyType === "subject" && Array.isArray(a.facultySubjects) && a.facultySubjects.length) { sub.textContent = "Faculty for: " + a.facultySubjects.join(", "); $("alertBtn").style.display = "none"; }
    else if (a.facultyType === "coordinator") sub.textContent = "Class Coordinator — " + myClass + " — live attendance overview";
  }).catch(() => {});

  api("/timetable/me").then(({ data }) => {
    const all = (data && data.timetable) || [];
    let myId = null; try { myId = (JSON.parse(localStorage.getItem("user") || "null") || {}).id; } catch (e) {}
    const real = myId && all.some((e) => e.teacherId) ? all.filter((e) => String(e.teacherId) === String(myId)) : all;   // only periods she teaches herself
    sampleTT = !all.length && USE_DEMO_DATA; ENTRIES = all.length ? real : (sampleTT ? sampleEntries() : []);
    renderTimetable(); showNote();
  }).catch((e) => { if (e.message !== "Unauthorized") $("periods").innerHTML = '<p class="empty err">Could not load your timetable.</p>'; });

  api("/requests/pending").then(({ data }) => {
    const n = Array.isArray(data) ? data.length : null; S.pending = n === null ? "--" : n; renderStats();
    const c = $("notifCount"); if (n) { c.textContent = n > 99 ? "99+" : n; c.classList.add("show"); }
  }).catch(() => {});

  if (USE_DEMO_DATA) {
    let d = new Date(todayD); while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
    const t = sampleDay(iso(d)); S.total = t.total; S.present = t.present; S.late = t.late; S.absent = t.absent; renderStats();
    const items = []; for (let i = 6; i >= 0; i--) { const x = new Date(todayD); x.setDate(x.getDate() - i); const w = x.getDay(), v = w === 0 || w === 6 ? 0 : sampleDay(iso(x)); items.push({ label: dayLabel(iso(x)), n: v ? v.present + v.late : 0 }); }
    renderTrend(items);
  } else {
    api("/reports/summary").then(({ status: s, data }) => {
      if (s !== 200 || !data) throw new Error("HTTP " + s);
      S.total = num(data.totalStudents); S.present = num(data.presentToday); S.late = num(data.lateToday); S.absent = num(data.absentToday); renderStats();
    }).catch((e) => { if (e.message !== "Unauthorized") toast("Could not load today's attendance summary (" + e.message + ").", false); });
    api("/reports/weekly-trend").then(({ status: s, data }) => {
      if (s !== 200 || !Array.isArray(data)) throw new Error("HTTP " + s);
      renderTrend(data.map((x) => ({ label: dayLabel(x.date), n: x.presentCount })));
    }).catch((e) => { if (e.message !== "Unauthorized") $("trend").innerHTML = '<p class="empty err">Could not load the weekly trend (' + esc(e.message) + ").</p>"; });
  }
  showNote();

  /* ---------- low attendance alerts (same endpoint as before) ---------- */
  let sending = false;
  $("alertBtn").addEventListener("click", () => {
    if (sending) return; sending = true; const b = $("alertBtn"), html = b.innerHTML; b.disabled = true; b.textContent = "Checking...";
    api("/alerts/low-attendance-check", { method: "POST", body: JSON.stringify({}) })
      .then(({ status: s, data }) => toast((data && (data.message || data.error)) || "Check complete.", s >= 200 && s < 300))
      .catch((e) => { if (e.message !== "Unauthorized") toast("Could not reach the server.", false); })
      .finally(() => { sending = false; b.disabled = false; b.innerHTML = html; });
  });
})();
</script>
<script src="theme.js"></script>
</body>
</html>
